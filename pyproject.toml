[project]
name = "aven"
version = "0.0.1"
description = "A local-first personal assistant harness: your machine, your keys, your data."
requires-python = ">=3.11"
dependencies = ["anthropic>=1.0", "textual>=8.2"]
license = "MIT"
authors = [{ name = "Evan L" }]
keywords = ["agent", "assistant", "llm", "claude", "local-first", "macos"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/evanl666/aven"
Issues = "https://github.com/evanl666/aven/issues"

[project.scripts]
aven = "aven.apps.cli_assistant.main:main"
aven-code = "aven.apps.cli_code.main:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aven"]
