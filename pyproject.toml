[project]
name = "aven"
version = "0.0.1"
description = "A local-first personal assistant harness: your machine, your keys, your data."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aven"]
