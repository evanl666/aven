                      - text: . Ethiopian forests, especially to the west of the Great Rift Valley, abound in wild arabica coffee, but we know very little about the origins of consumption there.¹ Coffee was probably long picked from the wild, and it was used to an increasing extent from the fourteenth century by the Islamized peoples of southeastern Ethiopia. The coffee habit diffused to the Rasulid sultanate in Yemen, which had strong commercial and cultural connections with Muslim kingdoms in Ethiopia. The consumption of coffee spread first around Aden, Mocha, and Zabid during the first half of the fifteenth century.
