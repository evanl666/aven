                      - generic [ref=f2e2309]: "I believe I forgot to tell you one Anecdote: When I first came to this House it was late in the Afternoon, and I had ridden 35 miles at least. \"Madam\" said I to Mrs. Huston, \"is it lawful for a weary Traveller to refresh himself with a Dish of Tea provided it has been honestly smuggled or paid no Duties?\"\"No sir, said she, we have renounced all Tea in this Place. I can't make Tea, but I'll make you Coffee.\" Accordingly, I have drunk Coffee every Afternoon since and have borne it very well. Tea must be universally renounced. I must be weaned, and the sooner, the better."
