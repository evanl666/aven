                - row [ref=f2e1425]:
                  - cell "World" [ref=f2e1426]
                  - cell "11.06" [ref=f2e1427]
                - row [ref=f2e1428]:
                  - cell [ref=f2e1429]:
                    - generic [ref=f2e1430]:
                      - text: "Source:"
                      - link "FAOSTAT" [ref=f2e1431] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/FAOSTAT
                      - text: of the
                      - link "United Nations" [ref=f2e1432] [cursor=pointer]:
                        - /url: https://en.wikipedia.org/wiki/United_Nations
                    - superscript [ref=f2e1433]:
                      - link "[160]" [ref=f2e1434] [cursor=pointer]:
                        - /url: "#cite_note-faostat-163"
            - region [ref=f2e1436]:
              - heading "World production" [level=3] [ref=f2e1438]
              - paragraph [ref=f2e1439]:
                - text: In 2023, world production of green coffee beans was 11 million
                - link "tonnes" [ref=f2e1440] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tonne
                - text: ", led by Brazil with 31% of the total and Vietnam as a secondary producer (table)."
            - region [ref=f2e1441]:
              - heading "Commodity market" [level=3] [ref=f2e1443]
              - figure "Coffee prices 1973–2022" [ref=f2e1444]:
                - link [ref=f2e1445] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Coffee-prices-historical-chart-data.webp
              - generic [ref=f2e1450]:
                - generic [ref=f2e1451]:
                  - link [ref=f2e1454] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Dülmen,_Privatrösterei_Schröer,_Kaffeebehälter_--_2018_--_0529.jpg
                  - generic [ref=f2e1456]: Coffee retailing
                - generic [ref=f2e1457]:
                  - link [ref=f2e1460] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:CXLT_Coffee.jpg
                  - generic [ref=f2e1462]: A bag of coffee beans
                - generic [ref=f2e1463]:
                  - link [ref=f2e1466] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Kaffepåse_-_2023.jpg
                  - generic [ref=f2e1468]:
                    - text: Bag with
                    - link "ziplock" [ref=f2e1469] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Ziploc
                    - text: and one-way valve to prevent
                    - link "mold" [ref=f2e1470] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Mold
              - paragraph [ref=f2e1471]:
                - text: Coffee is bought and sold as green coffee beans by roasters, investors, and price speculators as a tradable commodity in commodity markets and exchange-traded funds. Coffee
                - link "futures contracts" [ref=f2e1472] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Futures_contracts
                - text: for Grade 3 washed arabicas are traded on the
                - link "New York Mercantile Exchange" [ref=f2e1473] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/New_York_Mercantile_Exchange
                - text: under ticker symbol KC, with contract deliveries occurring every year in March, May, July, September, and December.
                - superscript [ref=f2e1474]:
                  - link "[161]" [ref=f2e1475] [cursor=pointer]:
                    - /url: "#cite_note-164"
                - superscript [ref=f2e1477]:
                  - link "[162]" [ref=f2e1478] [cursor=pointer]:
                    - /url: "#cite_note-165"
                - superscript [ref=f2e1480]:
                  - link "[163]" [ref=f2e1481] [cursor=pointer]:
                    - /url: "#cite_note-166"
                - superscript [ref=f2e1483]:
                  - link "[164]" [ref=f2e1484] [cursor=pointer]:
                    - /url: "#cite_note-167"
                - text: Higher and lower grade arabica coffees are sold through other channels. Futures contracts for robusta coffee are traded on the
                - link "London International Financial Futures and Options Exchange" [ref=f2e1486] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/London_International_Financial_Futures_and_Options_Exchange
                - text: and, since 2007, on the New York
                - link "Intercontinental Exchange" [ref=f2e1487] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Intercontinental_Exchange
                - text: .
                - superscript [ref=f2e1488]:
                  - link "[165]" [ref=f2e1489] [cursor=pointer]:
                    - /url: "#cite_note-168"
              - paragraph [ref=f2e1491]:
                - text: Dating to the 1970s, coffee has been incorrectly described by many, including historian
                - link "Mark Pendergrast" [ref=f2e1492] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mark_Pendergrast
                - text: ", as the world's \"second most legally traded commodity\"."
                - superscript [ref=f2e1493]:
                  - link "[166]" [ref=f2e1494] [cursor=pointer]:
                    - /url: "#cite_note-pendergrast2009-169"
                - superscript [ref=f2e1496]:
                  - link "[167]" [ref=f2e1497] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast2001-170"
                - text: Instead, "coffee was the second most valuable commodity exported by developing countries," from 1970 to circa 2000.
                - superscript [ref=f2e1499]:
                  - link "[168]" [ref=f2e1500] [cursor=pointer]:
                    - /url: "#cite_note-talbot2004-171"
                - text: This fact was derived from the
                - link "United Nations Conference on Trade and Development" [ref=f2e1502] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/United_Nations_Conference_on_Trade_and_Development
                - text: Commodity Yearbooks which show "Third World" commodity exports by value in the period 1970–1998 with crude oil in first place, coffee in second, followed by sugar, cotton, and others. Coffee continues to be an important commodity export for developing countries, but more recent figures are not readily available due to the shifting and politicized nature of the category "developing country".
                - superscript [ref=f2e1503]:
                  - link "[166]" [ref=f2e1504] [cursor=pointer]:
                    - /url: "#cite_note-pendergrast2009-169"
                - text: Coffee is one of seven commodities included in the
                - link "EU Regulation on Deforestation-free products" [ref=f2e1506] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/EU_Regulation_on_Deforestation-free_products
                - text: ", which aims to guarantee that the products European Union citizens consume do not contribute to deforestation or forest degradation worldwide."
                - superscript [ref=f2e1507]:
                  - link "[169]" [ref=f2e1508] [cursor=pointer]:
                    - /url: "#cite_note-eudef-172"
              - paragraph [ref=f2e1510]:
                - link "International Coffee Day" [ref=f2e1511] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/International_Coffee_Day
                - text: ", which is claimed to have originated in Japan in 1983 with an event organized by the All Japan Coffee Association, takes place on 29 September in several countries."
                - superscript [ref=f2e1512]:
                  - link "[170]" [ref=f2e1513] [cursor=pointer]:
                    - /url: "#cite_note-173"
                - text: There are numerous trade associations and lobbying and other organizations representing the coffee industry.
                - superscript [ref=f2e1515]:
                  - link "[171]" [ref=f2e1516] [cursor=pointer]:
                    - /url: "#cite_note-174"
                - superscript [ref=f2e1518]:
                  - link "[172]" [ref=f2e1519] [cursor=pointer]:
                    - /url: "#cite_note-175"
            - region [ref=f2e1521]:
              - heading "Consumption" [level=3] [ref=f2e1523]
              - figure "Coffee consumption, kilograms per capita, 2007" [ref=f2e1524]:
                - link [ref=f2e1525] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Coffee_consumption_map-en.svg
              - paragraph [ref=f2e1528]:
                - text: Nordic countries are the highest coffee-consuming nations when measured
                - link "per capita" [ref=f2e1529] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Per_capita
                - text: per year, with consumption in Finland as the world's highest.
                - superscript [ref=f2e1530]:
                  - link "[173]" [ref=f2e1531] [cursor=pointer]:
                    - /url: "#cite_note-176"
              - list [ref=f2e1533]:
                - listitem [ref=f2e1534]: Finland – 26.45 lb (12.00 kg)
                - listitem [ref=f2e1535]: Norway – 21.82 lb (9.90 kg)
                - listitem [ref=f2e1536]: Iceland – 19.84 lb (9.00 kg)
                - listitem [ref=f2e1537]: Denmark – 19.18 lb (8.70 kg)
                - listitem [ref=f2e1538]: Netherlands – 18.52 lb (8.40 kg)
                - listitem [ref=f2e1539]: Sweden – 18.00 lb (8.16 kg)
                - listitem [ref=f2e1540]: Switzerland – 17.42 lb (7.90 kg)
                - listitem [ref=f2e1541]: Belgium – 15.00 lb (6.80 kg)
                - listitem [ref=f2e1542]: Luxembourg – 14.33 lb (6.50 kg)
                - listitem [ref=f2e1543]: Canada – 14.33 lb (6.50 kg)
              - paragraph [ref=f2e1544]:
                - text: An April 2024,
                - link "National Coffee Association" [ref=f2e1545] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/National_Coffee_Association
                - text: survey indicated that coffee consumption in the U.S. reached a 20-year high, with 67% of U.S. adults reporting drinking coffee in the past day. This is a significant increase compared to 2004 when fewer than half of U.S. adults reported coffee consumption in the past day. Drip coffee remains the most popular brewing method, but espresso-based beverages, particularly lattes, espresso shots, and cappuccinos, gained popularity.
                - superscript [ref=f2e1546]:
                  - link "[174]" [ref=f2e1547] [cursor=pointer]:
                    - /url: "#cite_note-177"
            - region [ref=f2e1549]:
              - heading "Economic impacts" [level=3] [ref=f2e1551]
              - note [ref=f2e1552]:
                - text: "Further information:"
                - link "List of countries by coffee production" [ref=f2e1553] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_countries_by_coffee_production
              - figure "A map of coffee growing areas in Brazil" [ref=f2e1554]:
                - link [ref=f2e1555] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Brazil_Coffee_production_2020.jpg
              - paragraph [ref=f2e1558]:
                - text: In 1830, market volatility and thus increased returns, encouraged Brazilian entrepreneurs to shift their attention from gold to coffee, a crop hitherto reserved for local consumption. Concurrent with this shift was the commissioning of vital infrastructures, including approximately 7,000 km (4,300 mi) of railroads between 1860 and 1885. The creation of these railways enabled the importation of workers, to meet the enormous need for labor. This development primarily affected the
                - link "State of Rio de Janeiro" [ref=f2e1559] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rio_de_Janeiro_(state)
                - text: ", as well as the southern states of Brazil, most notably"
                - link "São Paulo" [ref=f2e1560] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/São_Paulo_(state)
                - text: ", due to its favorable climate, soils, and terrain."
                - superscript [ref=f2e1561]:
                  - link "[175]" [ref=f2e1562] [cursor=pointer]:
                    - /url: "#cite_note-178"
              - paragraph [ref=f2e1564]:
                - link "Coffee production" [ref=f2e1565] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_production_in_Brazil
                - text: attracted
                - link "immigrants" [ref=f2e1566] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Immigration_to_Brazil
                - text: in search of better economic opportunities in the early 20th century. Mainly, these were Portuguese, Italian, Spanish, German, and Japanese nationals. For instance, São Paulo received approximately 733,000 immigrants in the 1890s, while only receiving approximately 201,000 immigrants in the six years before 1890. The production yield of coffee increased. In 1880, São Paulo produced 1.2 million bags (25% of total production), in 1888 2.6 million (40%), and in 1902 8 million bags (60%).
                - superscript [ref=f2e1567]:
                  - link "[176]" [ref=f2e1568] [cursor=pointer]:
                    - /url: "#cite_note-Bresileco1-179"
              - paragraph [ref=f2e1570]: Coffee is then 63% of Brazil's exports. The gains made by this trade allow sustained economic growth in the country. The four years between planting a coffee and the first harvest extend seasonal variations in the price of coffee. The Brazilian government is thus forced, to some extent, to keep strong price subsidies during production periods.
            - region [ref=f2e1571]:
              - heading "Fair trade" [level=3] [ref=f2e1573]
              - note [ref=f2e1574]:
                - text: "Main article:"
                - link "Fair trade coffee" [ref=f2e1575] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fair_trade_coffee
              - note [ref=f2e1576]:
                - text: "See also:"
                - link "Fair trade debate" [ref=f2e1577] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fair_trade_debate
              - paragraph [ref=f2e1578]:
                - text: The concept of
                - link "fair trade" [ref=f2e1579] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fair_trade
                - text: labeling, which guarantees coffee growers a negotiated preharvest price, began in the late 1980s with the
                - link "Max Havelaar Foundation's" [ref=f2e1580] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stichting_Max_Havelaar
                - text: labeling program in the Netherlands. In 2004, 24,222 metric tons (of 7,050,000 produced worldwide) were fair trade; in 2005, 33,991 metric tons out of 6,685,000 were fair trade, an increase from 0.34% to 0.51%.
                - superscript [ref=f2e1581]:
                  - link "[177]" [ref=f2e1582] [cursor=pointer]:
                    - /url: "#cite_note-180"
                - superscript [ref=f2e1584]:
                  - link "[178]" [ref=f2e1585] [cursor=pointer]:
                    - /url: "#cite_note-181"
                - text: A number of
                - link "fair trade impact studies" [ref=f2e1587] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fair_trade_impact_studies
                - text: have shown that fair trade coffee produces a mixed impact on the communities that grow it. Many studies are skeptical about fair trade, reporting that it often worsens the bargaining power of those who are not part of it. The first fair-trade coffee was an effort to import Guatemalan coffee into Europe as "Indio Solidarity Coffee".
                - superscript [ref=f2e1588]:
                  - link "[179]" [ref=f2e1589] [cursor=pointer]:
                    - /url: "#cite_note-182"
              - paragraph [ref=f2e1591]:
                - text: Since the founding of organizations such as the
                - link "European Fair Trade Association" [ref=f2e1592] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/European_Fair_Trade_Association
                - text: (1987), the production and consumption of fair trade coffee has grown as some local and national coffee chains started to offer fair trade alternatives.
                - superscript [ref=f2e1593]:
                  - link "[180]" [ref=f2e1594] [cursor=pointer]:
                    - /url: "#cite_note-efta2009-183"
                - text: For example, in April 2000, after a year-long campaign by the human rights organization
                - link "Global Exchange" [ref=f2e1596] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Global_Exchange
                - text: ","
                - link "Starbucks" [ref=f2e1597] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Starbucks
                - text: decided to carry fair-trade coffee in its stores.
                - superscript [ref=f2e1598]:
                  - link "[181]" [ref=f2e1599] [cursor=pointer]:
                    - /url: "#cite_note-pelsmacker2005-184"
                - text: Since September 2009 all Starbucks espresso beverages in UK and Ireland are made with Fairtrade and Shared Planet certified coffee.
                - superscript [ref=f2e1601]:
                  - link "[182]" [ref=f2e1602] [cursor=pointer]:
                    - /url: "#cite_note-sbft-185"
              - paragraph [ref=f2e1604]:
                - text: A 2005 study in Belgium concluded that consumers' buying behavior is not consistent with their positive attitude toward ethical products. On average 46% of European consumers claimed to be willing to pay substantially more for ethical products, including fair-trade products such as coffee. The study found that the majority of respondents were unwilling to pay the actual price premium of 27% for fair trade coffee.
                - superscript [ref=f2e1605]:
                  - link "[181]" [ref=f2e1606] [cursor=pointer]:
                    - /url: "#cite_note-pelsmacker2005-184"
            - region [ref=f2e1608]:
              - heading "Specialty coffee and new trading relationships" [level=3] [ref=f2e1610]
              - paragraph [ref=f2e1611]:
                - link "Specialty coffee" [ref=f2e1612] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Specialty_coffee
                - text: has driven a desire for more traceable coffee, and as such businesses are offering coffees that may come from a single origin, or a single lot from a single farm. This can give rise to the roaster developing a relationship with the producer, to discuss and collaborate on coffee. The roaster may also choose to cut out the importers and exporters to directly trade with the producer, or they may "fairly trade", where any third-parties involved in the transaction are thought to have added value, and there is a high level of transparency around the price, although often there is no certification to back it up.
                - superscript [ref=f2e1613]:
                  - link "[183]" [ref=f2e1614] [cursor=pointer]:
                    - /url: "#cite_note-Hoffmann-2018-186"
                - text: This process tends to only be done for high-quality products since keeping the coffee separate from other coffees adds costs, and so only coffee that roasters believe can command a higher price will be kept separate.
                - superscript [ref=f2e1616]:
                  - link "[184]" [ref=f2e1617] [cursor=pointer]:
                    - /url: "#cite_note-187"
              - paragraph [ref=f2e1619]:
                - text: Some coffee is sold through internet auction – much of it is sold through a competition, with coffees passing through local and international jurors, and then the best coffees being selected to be bid on. Some estates known for high-quality coffee also sell their coffee through an online auction. This can lead to increased price transparency since the final price paid is usually published.
                - superscript [ref=f2e1620]:
                  - link "[183]" [ref=f2e1621] [cursor=pointer]:
                    - /url: "#cite_note-Hoffmann-2018-186"
          - region [ref=f2e1623]:
            - heading "Composition" [level=2] [ref=f2e1625]
            - paragraph [ref=f2e1626]:
              - text: Brewed coffee made from typical grounds and tap water is 99.4% water and contains 40 mg of caffeine per 100 ml with no
              - link "essential nutrients" [ref=f2e1627] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nutrient
              - text: in significant content.
              - superscript [ref=f2e1628]:
                - link "[185]" [ref=f2e1629] [cursor=pointer]:
                  - /url: "#cite_note-fdc-coffee-188"
              - text: Restaurant-brewed espresso is 97.8% water and contains some
              - link "dietary minerals" [ref=f2e1631] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mineral_(nutrient)
              - text: ","
              - link "B vitamins" [ref=f2e1632] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/B_vitamins
              - text: ", and 212 mg of caffeine per 100 ml."
              - superscript [ref=f2e1633]:
                - link "[186]" [ref=f2e1634] [cursor=pointer]:
                  - /url: "#cite_note-fdc-espresso-189"
            - paragraph [ref=f2e1636]:
              - text: Although
              - link "polyphenols" [ref=f2e1637] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Polyphenol
              - text: ", particularly"
              - link "chlorogenic acid" [ref=f2e1638] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Chlorogenic_acid
              - text: ", are present in coffee,"
              - superscript [ref=f2e1639]:
                - link "[187]" [ref=f2e1640] [cursor=pointer]:
                  - /url: "#cite_note-190"
              - text: there is no evidence that the polyphenols impart a health benefit or have
              - link "antioxidant" [ref=f2e1642] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Antioxidant
              - text: value following ingestion.
              - superscript [ref=f2e1643]:
                - link "[188]" [ref=f2e1644] [cursor=pointer]:
                  - /url: "#cite_note-lpi-191"
              - superscript [ref=f2e1646]:
                - link "[189]" [ref=f2e1647] [cursor=pointer]:
                  - /url: "#cite_note-192"
              - text: Overall, coffee components do not pose risks to health and do not provide health effects for adults consuming about 3–4 cups per day, which would supply 300–400 mg of caffeine per day.
              - superscript [ref=f2e1649]:
                - link "[188]" [ref=f2e1650] [cursor=pointer]:
                  - /url: "#cite_note-lpi-191"
          - region [ref=f2e1652]:
            - heading "Research" [level=2] [ref=f2e1654]
            - note [ref=f2e1655]:
              - text: "Main articles:"
              - link "List of chemical compounds in coffee" [ref=f2e1656] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_chemical_compounds_in_coffee
              - text: and
              - link "Health effects of coffee" [ref=f2e1657] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Health_effects_of_coffee
            - paragraph [ref=f2e1658]:
              - text: In 2026, the
              - link "American Heart Association" [ref=f2e1659] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/American_Heart_Association
              - text: stated that drinking as many as five cups of caffeinated coffee per day (intake of about 400 mg of caffeine per day) over adult life may benefit cardiovascular health in some people.
              - superscript [ref=f2e1660]:
                - link "[190]" [ref=f2e1661] [cursor=pointer]:
                  - /url: "#cite_note-aha-193"
              - text: The statement was based on a scientific review of human research indicating that regular coffee consumption may be associated with a reduced risk of
              - link "type 2 diabetes" [ref=f2e1663] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Type_2_diabetes
              - text: and
              - link "stroke" [ref=f2e1664] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Stroke
              - text: ", although considerable heterogeneity exists in the studies to date."
              - superscript [ref=f2e1665]:
                - link "[191]" [ref=f2e1666] [cursor=pointer]:
                  - /url: "#cite_note-marcus-194"
              - link "Mechanisms" [ref=f2e1668] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mechanism_of_action
              - text: for how habitual coffee consumption has cardiovascular effects are unknown.
              - superscript [ref=f2e1669]:
                - link "[191]" [ref=f2e1670] [cursor=pointer]:
                  - /url: "#cite_note-marcus-194"
            - paragraph [ref=f2e1672]:
              - text: Review of
              - link "clinical trials" [ref=f2e1673] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Clinical_trial
              - text: found that drinking coffee is generally safe within usual levels of intake and is more likely to improve health outcomes than to cause harm at doses of 3–5 cups of coffee daily.
              - superscript [ref=f2e1674]:
                - link "[191]" [ref=f2e1675] [cursor=pointer]:
                  - /url: "#cite_note-marcus-194"
              - superscript [ref=f2e1677]:
                - link "[192]" [ref=f2e1678] [cursor=pointer]:
                  - /url: "#cite_note-poole-195"
              - text: Exceptions include a possible increased risk in women having bone fractures, and a possible increased risk in pregnant women of fetal loss or decreased birth weight.
              - superscript [ref=f2e1680]:
                - link "[192]" [ref=f2e1681] [cursor=pointer]:
                  - /url: "#cite_note-poole-195"
              - text: Results were complicated by poor study quality, and differences in age, gender, health status, and serving size.
              - superscript [ref=f2e1683]:
                - link "[191]" [ref=f2e1684] [cursor=pointer]:
                  - /url: "#cite_note-marcus-194"
              - superscript [ref=f2e1686]:
                - link "[192]" [ref=f2e1687] [cursor=pointer]:
                  - /url: "#cite_note-poole-195"
            - paragraph [ref=f2e1689]:
              - text: Coffee may have
              - link "laxative" [ref=f2e1690] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Laxative
              - text: effects,
              - link "inducing defecation" [ref=f2e1691] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gastrocolic_reflex
              - text: in some people within minutes of consumption.
              - superscript [ref=f2e1692]:
                - link "[193]" [ref=f2e1693] [cursor=pointer]:
                  - /url: "#cite_note-Eamudomkarn_2018-196"
              - superscript [ref=f2e1695]:
                - link "[194]" [ref=f2e1696] [cursor=pointer]:
                  - /url: "#cite_note-Nehlig_2022-197"
              - text: The specific
              - link "mechanism of action" [ref=f2e1698] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mechanism_of_action
              - text: and chemical constituents responsible are still unknown, but caffeine is likely not responsible.
              - superscript [ref=f2e1699]:
                - link "[195]" [ref=f2e1700] [cursor=pointer]:
                  - /url: "#cite_note-198"
            - region [ref=f2e1702]:
              - heading "Caffeine content" [level=3] [ref=f2e1704]
              - figure [ref=f2e1705]:
                - link [ref=f2e1706] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Caffeine-2D-skeletal.svg
                - generic [ref=f2e1708]:
                  - link "Skeletal formula" [ref=f2e1709] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Skeletal_formula
                  - text: of a
                  - link "caffeine" [ref=f2e1710] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Caffeine
                  - text: molecule
              - note [ref=f2e1711]:
                - text: "See also:"
                - link "Low caffeine coffee" [ref=f2e1712] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Low_caffeine_coffee
              - paragraph [ref=f2e1713]:
                - text: A psychoactive chemical in coffee –
                - link "caffeine" [ref=f2e1714] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Caffeine
                - text: – is an
                - link "adenosine receptor" [ref=f2e1715] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Adenosine_receptor
                - link "antagonist" [ref=f2e1716] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Receptor_antagonist
                - text: known for its
                - link "stimulant" [ref=f2e1717] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stimulant
                - text: effects.
                - superscript [ref=f2e1718]:
                  - link "[188]" [ref=f2e1719] [cursor=pointer]:
                    - /url: "#cite_note-lpi-191"
                - superscript [ref=f2e1721]:
                  - link "[196]" [ref=f2e1722] [cursor=pointer]:
                    - /url: "#cite_note-199"
                - text: Depending on the type of coffee and method of preparation, the caffeine content of a single serving can vary greatly.
                - superscript [ref=f2e1724]:
                  - link "[197]" [ref=f2e1725] [cursor=pointer]:
                    - /url: "#cite_note-Bunker-200"
                - superscript [ref=f2e1727]:
                  - link "[198]" [ref=f2e1728] [cursor=pointer]:
                    - /url: "#cite_note-201"
                - superscript [ref=f2e1730]:
                  - link "[199]" [ref=f2e1731] [cursor=pointer]:
                    - /url: "#cite_note-202"
                - text: The caffeine content of a cup of coffee varies depending mainly on the brewing method, and also on the coffee variety, such as 40 mg per 100 ml in regular coffee and 212 mg per 100 ml in espresso.
                - superscript [ref=f2e1733]:
                  - link "[185]" [ref=f2e1734] [cursor=pointer]:
                    - /url: "#cite_note-fdc-coffee-188"
                - superscript [ref=f2e1736]:
                  - link "[186]" [ref=f2e1737] [cursor=pointer]:
                    - /url: "#cite_note-fdc-espresso-189"
                - text: "According to a 1979 analysis, coffee has the following caffeine content, depending on how it is prepared:"
                - superscript [ref=f2e1739]:
                  - link "[197]" [ref=f2e1740] [cursor=pointer]:
                    - /url: "#cite_note-Bunker-200"
              - table [ref=f2e1742]:
                - rowgroup [ref=f2e1743]:
                  - row [ref=f2e1744]:
                    - columnheader [ref=f2e1745]
                    - columnheader "Serving size" [ref=f2e1746]
                    - columnheader "Caffeine content" [ref=f2e1747]
                  - row [ref=f2e1748]:
                    - cell "Brewed" [ref=f2e1749]
                    - cell "200 mL (7 US fl oz)" [ref=f2e1750]
                    - cell "80–135 mg" [ref=f2e1751]
                  - row [ref=f2e1752]:
                    - cell "Drip" [ref=f2e1753]
                    - cell "200 mL (7 US fl oz)" [ref=f2e1754]
                    - cell "115–175 mg" [ref=f2e1755]
                  - row [ref=f2e1756]:
                    - cell "Espresso" [ref=f2e1757]
                    - cell "45–60 mL (1 + 1⁄2–2 US fl oz)" [ref=f2e1758]:
                      - text: 45–60 mL (
                      - generic [ref=f2e1759]:
                        - text: "1"
                        - generic [ref=f2e1760]: +
                        - text: 1⁄2
                      - text: –2 US fl oz)
                    - cell "100 mg" [ref=f2e1761]
              - paragraph [ref=f2e1762]:
                - text: Caffeine remains stable up to 200 °C (392 °F) and completely decomposes around 285 °C (545 °F).
                - superscript [ref=f2e1763]:
                  - link "[200]" [ref=f2e1764] [cursor=pointer]:
                    - /url: "#cite_note-203"
                - text: Given that roasting temperatures do not exceed 200 °C (392 °F) for long and rarely if ever reach 285 °C (545 °F), the caffeine content of a coffee is not likely changed much by the roasting process.
                - superscript [ref=f2e1766]:
                  - link "[201]" [ref=f2e1767] [cursor=pointer]:
                    - /url: "#cite_note-204"
          - region [ref=f2e1769]:
            - heading "Society and culture" [level=2] [ref=f2e1771]
            - note [ref=f2e1772]:
              - text: "Main article:"
              - link "Coffee culture" [ref=f2e1773] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_culture
            - note [ref=f2e1774]:
              - text: "See also:"
              - link "Coffee culture in Australia" [ref=f2e1775] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_culture_in_Australia
              - text: and
              - link "Coffee culture in former Yugoslavia" [ref=f2e1776] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_culture_in_former_Yugoslavia
            - figure [ref=f2e1777]:
              - link [ref=f2e1778] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:1004-CoffeeSceneCairo18th.jpg
              - generic [ref=f2e1780]:
                - text: A coffeehouse in
                - link "Cairo" [ref=f2e1781] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cairo
                - text: ", 19th century"
            - paragraph [ref=f2e1782]:
              - text: Coffee is often consumed alongside (or instead of) breakfast by many at home or when eating out at
              - link "diners" [ref=f2e1783] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Diner
              - text: or cafeterias. It is often served at the end of a formal meal, normally with a dessert, and at times with an after-dinner mint, especially when consumed at a restaurant or dinner party.
              - superscript [ref=f2e1784]:
                - link "[202]" [ref=f2e1785] [cursor=pointer]:
                  - /url: "#cite_note-205"
            - region [ref=f2e1787]:
              - heading "Coffeehouses" [level=3] [ref=f2e1789]
              - note [ref=f2e1790]:
                - text: "Main article:"
                - link "Coffeehouse" [ref=f2e1791] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffeehouse
              - figure [ref=f2e1792]:
                - link [ref=f2e1793] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Wien_Cafe_Central_2004.jpg
                - generic [ref=f2e1795]:
                  - link "Café Central" [ref=f2e1796] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Café_Central
                  - text: in
                  - link "Vienna" [ref=f2e1797] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Vienna
                  - text: ", Austria. A staple of the"
                  - link "Viennese coffee house" [ref=f2e1798] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Viennese_coffee_house
                  - text: tradition, it has remained open since 1876.
              - paragraph [ref=f2e1799]:
                - text: Widely known as coffeehouses or cafés, establishments serving prepared coffee or other hot beverages have existed for over 500 years. The first coffeehouse in Constantinople was opened in 1475 by traders arriving from Damascus and Aleppo.
                - superscript [ref=f2e1800]:
                  - link "[203]" [ref=f2e1801] [cursor=pointer]:
                    - /url: "#cite_note-206"
              - paragraph [ref=f2e1803]:
                - text: A contemporary term for a person who makes coffee beverages, often a coffeehouse employee, is a
                - link "barista" [ref=f2e1805] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Barista
                - text: . The Specialty Coffee Association of Europe and the Specialty Coffee Association of America have been influential in setting standards and providing training.
                - superscript [ref=f2e1806]:
                  - link "[204]" [ref=f2e1807] [cursor=pointer]:
                    - /url: "#cite_note-207"
            - region [ref=f2e1809]:
              - heading "Break" [level=3] [ref=f2e1811]
              - paragraph [ref=f2e1812]:
                - text: The
                - link "coffee break" [ref=f2e1813] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_break
                - text: in the United States and elsewhere is a short mid-morning rest period granted to employees. It originated in the late 19th century in
                - link "Stoughton, Wisconsin" [ref=f2e1814] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Stoughton,_Wisconsin
                - text: ", with the wives of Norwegian immigrants. The city celebrates this every year with the Stoughton Coffee Break Festival."
                - superscript [ref=f2e1815]:
                  - link "[205]" [ref=f2e1816] [cursor=pointer]:
                    - /url: "#cite_note-208"
                - text: In 1951, Time noted that "since the war, the coffee break has been written into union contracts".
                - superscript [ref=f2e1818]:
                  - link "[206]" [ref=f2e1819] [cursor=pointer]:
                    - /url: "#cite_note-209"
              - paragraph [ref=f2e1821]:
                - text: In 1952, the term became common through a Pan-American Coffee Bureau ad campaign which urged consumers, "Give yourself a Coffee-Break – and Get What Coffee Gives to You."
                - superscript [ref=f2e1822]:
                  - link "[207]" [ref=f2e1823] [cursor=pointer]:
                    - /url: "#cite_note-210"
                - link "John B. Watson" [ref=f2e1825] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_B._Watson
                - text: ", a behavioral psychologist who worked with"
                - link "Maxwell House" [ref=f2e1826] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maxwell_House
                - text: later in his career, helped to popularize coffee breaks within American culture.
                - superscript [ref=f2e1827]:
                  - link "[208]" [ref=f2e1828] [cursor=pointer]:
                    - /url: "#cite_note-211"
            - region [ref=f2e1830]:
              - heading "Prohibition and condemnation" [level=3] [ref=f2e1832]
              - figure [ref=f2e1833]:
                - link [ref=f2e1834] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:John_Frederick_Lewis_004.jpg
                - generic [ref=f2e1836]:
                  - text: The Coffee Bearer,
                  - link "Cairo" [ref=f2e1837] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Cairo
                  - text: ", an"
                  - link "Orientalist" [ref=f2e1838] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Orientalism
                  - text: painting by
                  - link "John Frederick Lewis" [ref=f2e1839] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/John_Frederick_Lewis
                  - text: (1857)
              - paragraph [ref=f2e1840]:
                - text: Historically, several religious groups have prohibited or condemned the consumption of coffee. The permissibility of coffee was debated in the Islamic world during the early 16th century, variously being permitted or prohibited until it was ultimately accepted by the 1550s.
                - superscript [ref=f2e1841]:
                  - link "[209]" [ref=f2e1842] [cursor=pointer]:
                    - /url: "#cite_note-212"
                - text: Contention existed among Ashkenazi Jews as to whether coffee was acceptable for Passover until it was certified kosher in 1923.
                - superscript [ref=f2e1844]:
                  - link "[210]" [ref=f2e1845] [cursor=pointer]:
                    - /url: "#cite_note-213"
                - text: Some Christian groups, such as Mormons and Seventh-day Adventists, discourage the consumption of coffee.
                - superscript [ref=f2e1847]:
                  - link "[211]" [ref=f2e1848] [cursor=pointer]:
                    - /url: "#cite_note-beliefnet-mormons-214"
                - superscript [ref=f2e1850]:
                  - link "[212]" [ref=f2e1851] [cursor=pointer]:
                    - /url: "#cite_note-215"
                - superscript [ref=f2e1853]:
                  - link "[213]" [ref=f2e1854] [cursor=pointer]:
                    - /url: "#cite_note-216"
                - text: Because of coffee's association with
                - link "Muslims" [ref=f2e1856] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Muslims
                - text: ","
                - link "Ethiopian Orthodox Christians" [ref=f2e1857] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ethiopian_Orthodox_Tewahedo_Church
                - text: avoided it until the end of the 19th century.
                - superscript [ref=f2e1858]:
                  - link "[214]" [ref=f2e1859] [cursor=pointer]:
                    - /url: "#cite_note-217"
                - text: Some
                - link "Rastafarians" [ref=f2e1861] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rastafarians
                - text: also generally avoid coffee.
                - superscript [ref=f2e1862]:
                  - link "[215]" [ref=f2e1863] [cursor=pointer]:
                    - /url: "#cite_note-218"
              - paragraph [ref=f2e1865]:
                - text: Coffee has been prohibited for political and economic reasons. King
                - link "Charles II of England" [ref=f2e1866] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Charles_II_of_England
                - text: briefly outlawed coffeehouses to quell perceived rebellion.
                - superscript [ref=f2e1867]:
                  - link "[46]" [ref=f2e1868] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200113-49"
                - text: King
                - link "Frederick the Great" [ref=f2e1870] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Frederick_II_of_Prussia
                - text: banned it in Prussia, concerned about the price of importing of coffee without production colonies.
                - superscript [ref=f2e1871]:
                  - link "[216]" [ref=f2e1872] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200111-219"
                - superscript [ref=f2e1874]:
                  - link "[217]" [ref=f2e1875] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEBersten199953-220"
                - text: Sweden
                - link "prohibited coffee in the 18th century" [ref=f2e1877] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_in_Sweden#Restrictions
                - text: for the same reasons.
                - superscript [ref=f2e1878]:
                  - link "[218]" [ref=f2e1879] [cursor=pointer]:
                    - /url: "#cite_note-221"
                - text: Coffee has seldom been prohibited based on its intoxicating effect.
                - superscript [ref=f2e1881]:
                  - link "[219]" [ref=f2e1882] [cursor=pointer]:
                    - /url: "#cite_note-222"
            - region [ref=f2e1884]:
              - heading "Folklore and culture" [level=3] [ref=f2e1886]
              - note [ref=f2e1887]:
                - text: "\"Cup of joe\" redirects here. For other uses, see"
                - link "Cup of Joe (disambiguation)" [ref=f2e1888] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cup_of_Joe_(disambiguation)
                - text: .
              - paragraph [ref=f2e1889]:
                - text: There are many stories about coffee and its impact on people and society. The
                - link "Oromo people" [ref=f2e1890] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Oromo_people
                - text: would customarily plant a coffee tree on the graves of powerful sorcerers. They believed that the first coffee bush sprang up from the tears that the god of heaven shed over the corpse of a dead sorcerer.
                - superscript [ref=f2e1891]:
                  - link "[220]" [ref=f2e1892] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEAllen199927-223"
                - link "Johann Sebastian Bach" [ref=f2e1894] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Johann_Sebastian_Bach
                - text: was inspired to compose the humorous
                - link "Coffee Cantata" [ref=f2e1896] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Schweigt_stille,_plaudert_nicht
                - text: about
                - link "coffee addiction" [ref=f2e1897] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Caffeine_dependence
                - text: ", which was controversial in the early 18th century."
                - superscript [ref=f2e1898]:
                  - link "[221]" [ref=f2e1899] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200110-224"
              - paragraph [ref=f2e1901]:
                - text: In the United States, coffee is sometimes called a "cup of Joe". The origin of this phrase is in dispute; a common story is that in World War I the US Secretary of the Navy
                - link "Josephus \"Joe\" Daniels" [ref=f2e1902] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Josephus_Daniels
                - text: banned alcohol on navy ships which meant that the strongest drink available aboard the ship was black coffee. Sailors began referring to coffee as a "cup of Joe" in reference to Daniels. However, this story may be apocryphal since the first written account of it was in 1930, some 15 years later. Another explanation is that a formerly popular nickname for coffee, jamoke, from mocha java, was shortened to Joe. A third origin story is that since coffee is such a commonly consumed beverage, it is the drink of the
                - link "average Joe" [ref=f2e1903] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Average_Joe
                - text: .
                - superscript [ref=f2e1904]:
                  - link "[222]" [ref=f2e1905] [cursor=pointer]:
                    - /url: "#cite_note-225"
                - superscript [ref=f2e1907]:
                  - link "[223]" [ref=f2e1908] [cursor=pointer]:
                    - /url: "#cite_note-226"
                - superscript [ref=f2e1910]:
                  - link "[224]" [ref=f2e1911] [cursor=pointer]:
                    - /url: "#cite_note-227"
