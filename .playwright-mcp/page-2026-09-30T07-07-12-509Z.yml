                      - text: . Mr. Osmund Gunderson decided to ask the Norwegian wives, who lived just up the hill from his warehouse, if they would come and help him sort the tobacco. The women agreed, as long as they could have a break in the morning and another in the afternoon, to go home and tend to their chores. Of course, this also meant they were free to have a cup of coffee from the pot that was always hot on the stove. Mr. Gunderson agreed and with this simple habit, the coffee break was born.
