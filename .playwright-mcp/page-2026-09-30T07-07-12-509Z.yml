                  - cell [ref=f2e224]:
                    - text: Roasted
                    - link "coffee beans" [ref=f2e225] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Coffee_bean
                - row [ref=f2e226]:
                  - rowheader "Standard drinkware" [ref=f2e227]
                  - cell [ref=f2e228]:
                    - link "Mug" [ref=f2e229] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Mug
            - paragraph [ref=f2e230]:
              - text: Coffee is a beverage
              - link "brewed" [ref=f2e231] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_brew
              - text: from roasted, ground
              - link "coffee beans" [ref=f2e232] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_bean
              - text: . Dark-colored and
              - link "bitter" [ref=f2e233] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bitterness
              - text: ", coffee has a"
              - link "stimulating effect" [ref=f2e234] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Stimulant
              - text: on humans due to its
              - link "caffeine" [ref=f2e235] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Caffeine
              - text: content; however
              - link "decaffeinated" [ref=f2e236] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Decaffeinated
              - text: coffee is also commercially available. There are also various
              - link "coffee substitutes" [ref=f2e237] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_substitute
              - text: .
            - paragraph [ref=f2e238]:
              - text: Coffee production begins when the seeds from coffee cherries, the
              - link "Coffea" [ref=f2e240] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffea
              - text: plant's fruits, are separated to produce unroasted green coffee beans. The "beans" are
              - link "roasted" [ref=f2e241] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_roasting
              - text: and then ground into fine particles. Coffee is brewed from the ground roasted beans, which are typically steeped in hot water before being filtered out. It is usually served hot, although chilled or
              - link "iced coffee" [ref=f2e242] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Iced_coffee
              - text: is common. Coffee can be
              - link "prepared" [ref=f2e243] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_preparation
              - text: and presented in
              - link "a variety of ways" [ref=f2e244] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_coffee_drinks
              - text: ", e.g.,"
              - link "espresso" [ref=f2e245] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Espresso
              - text: ","
              - link "French press" [ref=f2e246] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/French_press
              - text: ", caffè"
              - link "latte" [ref=f2e247] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Latte
              - text: ", or already-brewed"
              - link "canned coffee" [ref=f2e248] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Canned_coffee
              - text: . Sugar, sugar substitutes, milk, and cream are often added and change the flavor.
            - paragraph [ref=f2e249]:
              - text: Though coffee has become a global commodity, it has
              - link "a history" [ref=f2e250] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/History_of_coffee
              - text: tied to food traditions around the
              - link "Red Sea" [ref=f2e251] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Red_Sea
              - text: . The earliest reports of coffee drinking pertain to the plant's use among the
              - link "Sufis" [ref=f2e252] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sufi
              - text: of Yemen in
              - link "southern Arabia" [ref=f2e253] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/South_Arabia
              - text: in the middle of the 15th century.
              - superscript [ref=f2e254]:
                - link "[4]" [ref=f2e255] [cursor=pointer]:
                  - /url: "#cite_note-Wein34-4"
              - superscript [ref=f2e257]:
                - link "[5]" [ref=f2e258] [cursor=pointer]:
                  - /url: "#cite_note-5"
              - text: Up to the end of the 17th century, most of the world's coffee was imported from Yemen. As it gained in popularity, coffee started to be cultivated in
              - link "Java" [ref=f2e260] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Java
              - text: in the 17th century and the
              - link "Americas" [ref=f2e261] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Americas
              - text: from the 18th century.
              - superscript [ref=f2e262]:
                - link "[6]" [ref=f2e263] [cursor=pointer]:
                  - /url: "#cite_note-:2-6"
            - paragraph [ref=f2e265]:
              - text: The two most commonly grown coffee bean types are
              - link "C. arabica" [ref=f2e267] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffea_arabica
              - text: and
              - link "C. robusta" [ref=f2e269] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Robusta_coffee
              - text: .
              - superscript [ref=f2e270]:
                - link "[7]" [ref=f2e271] [cursor=pointer]:
                  - /url: "#cite_note-7"
              - text: Coffee plants are cultivated in
              - link "over 70 countries" [ref=f2e273] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_countries_by_coffee_production
              - text: ", primarily in the equatorial regions of the Americas, Southeast Asia, the Indian subcontinent, and Africa. Green, unroasted coffee is traded as an agricultural commodity. The"
              - link "global coffee industry" [ref=f2e274] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/International_Coffee_Organization
              - text: was worth
              - link "US$" [ref=f2e275] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/US$
              - text: 495.50 billion in 2023.
              - superscript [ref=f2e276]:
                - link "[8]" [ref=f2e277] [cursor=pointer]:
                  - /url: "#cite_note-8"
              - text: In 2023, Brazil was the leading grower of coffee beans, producing 31% of the world's total, followed by Vietnam. While coffee sales reach billions of dollars annually worldwide, coffee farmers disproportionately live in poverty. Critics of the
              - link "coffee industry" [ref=f2e279] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Economics_of_coffee
              - text: have pointed to its negative impact on the environment, including
              - link "clearing of land" [ref=f2e280] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Deforestation
              - text: for coffee growing and water use.
          - region [ref=f2e281]:
            - heading "Etymology" [level=2] [ref=f2e283]
            - figure "Green coffee describes the beans before roasting." [ref=f2e284]:
              - link [ref=f2e285] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Coffee_beans_unroasted.jpg
            - paragraph [ref=f2e288]:
              - text: The word coffee entered the English language in 1582 via the Dutch
              - generic "Dutch-language text" [ref=f2e289]: koffie
              - text: ", borrowed from the Ottoman Turkish"
              - generic "Ottoman Turkish (1500-1928)-language text" [ref=f2e290]: kahve
              - text: (
              - generic "Ottoman Turkish (1500-1928)-language text" [ref=f2e291]: قهوه
              - text: ), borrowed from the Arabic
              - generic "Arabic-language text" [ref=f2e292]: qahwah
              - text: (
              - generic "Arabic-language text" [ref=f2e293]: قَهْوَة
              - text: ).
              - superscript [ref=f2e294]:
                - link "[9]" [ref=f2e295] [cursor=pointer]:
                  - /url: "#cite_note-OED-9"
              - text: Medieval Arabic lexicons traditionally held that the etymology of
              - generic "Arabic-language text" [ref=f2e297]: qahwah
              - text: meant 'wine', given its distinctly dark color, and was derived from the verb
              - generic "Arabic-language text" [ref=f2e298]: qahiya
              - text: (
              - generic "Arabic-language text" [ref=f2e299]: قَهِيَ
              - text: ), '
              - link "to have no appetite" [ref=f2e300] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Anorectic
              - text: "'."
              - superscript [ref=f2e301]:
                - link "[10]" [ref=f2e302] [cursor=pointer]:
                  - /url: "#cite_note-Kaye-10"
              - text: The word
              - generic "Arabic-language text" [ref=f2e304]: qahwah
              - text: most likely meant 'the dark one', referring to the brew or the bean.
              - superscript [ref=f2e305]:
                - link "[10]" [ref=f2e306] [cursor=pointer]:
                  - /url: "#cite_note-Kaye-10"
            - paragraph [ref=f2e308]:
              - generic "Arabic-language text" [ref=f2e309]: qahwah
              - text: is not the name of the bean, which are known in Arabic as
              - generic "Arabic-language text" [ref=f2e310]: bunn
              - text: and in
              - link "Cushitic languages" [ref=f2e311] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Cushitic_languages
              - text: as
              - generic "Cushitic languages collective text" [ref=f2e312]: būn
              - text: . Semitic languages have the root
              - generic "Semitic languages collective text" [ref=f2e313]: qhh
              - text: ", 'dark color', which became a natural designation for the beverage. Its cognates include the Hebrew"
              - generic "Hebrew-language text" [ref=f2e314]: qehe(h)
              - text: "'dulling' and the"
              - link "Aramaic" [ref=f2e315] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Aramaic
              - text: qahey ('give acrid taste to').
              - superscript [ref=f2e316]:
                - link "[10]" [ref=f2e317] [cursor=pointer]:
                  - /url: "#cite_note-Kaye-10"
              - text: Although etymologists have connected it with a word meaning 'wine', it is also thought to be from the
              - link "Kaffa" [ref=f2e319] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Kaffa_Province
              - text: region of Ethiopia.
              - superscript [ref=f2e320]:
                - link "[11]" [ref=f2e321] [cursor=pointer]:
                  - /url: "#cite_note-11"
            - paragraph [ref=f2e323]:
              - text: The terms
              - link "coffee pot" [ref=f2e325] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_pot
              - text: and
              - link "coffee break" [ref=f2e327] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_break
              - text: originated in 1705 and 1952, respectively.
              - superscript [ref=f2e328]:
                - link "[12]" [ref=f2e329] [cursor=pointer]:
                  - /url: "#cite_note-auto-12"
          - region [ref=f2e331]:
            - heading "History" [level=2] [ref=f2e333]
            - note [ref=f2e334]:
              - text: "Main article:"
              - link "History of coffee" [ref=f2e335] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/History_of_coffee
            - region [ref=f2e336]:
              - heading "Legendary accounts and myths" [level=3] [ref=f2e338]
              - paragraph [ref=f2e339]:
                - text: There are multiple anecdotal origin stories which lack evidence. Ralph S. Hattox records traditions in which the Islamic prophet
                - link "Muhammad" [ref=f2e340] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Muhammad
                - text: is said to have been introduced to a stimulating beverage by the
                - link "Angel Gabriel" [ref=f2e341] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Angel_Gabriel
                - text: ", who recommended it for its restorative qualities."
                - superscript [ref=f2e342]:
                  - link "[13]" [ref=f2e343] [cursor=pointer]:
                    - /url: "#cite_note-13"
                - text: In another commonly repeated legend,
                - link "Kaldi" [ref=f2e345] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kaldi
                - text: ", a 9th-century Ethiopian or Arab goatherd,"
                - superscript [ref=f2e346]:
                  - link "[14]" [ref=f2e347] [cursor=pointer]:
                    - /url: "#cite_note-Brill_TaleOfTea_ArabianGoatherd-14"
                - superscript [ref=f2e349]:
                  - link "[15]" [ref=f2e350] [cursor=pointer]:
                    - /url: "#cite_note-15"
                - superscript [ref=f2e352]:
                  - link "[16]" [ref=f2e353] [cursor=pointer]:
                    - /url: "#cite_note-Britannica_Coffee_ArabGoatherd-16"
                - text: first observed the coffee plant after seeing his flock energized by chewing on the plant.
                - superscript [ref=f2e355]:
                  - link "[4]" [ref=f2e356] [cursor=pointer]:
                    - /url: "#cite_note-Wein34-4"
                - text: This legend does not appear before 1671, indicating the story is likely apocryphal, first being related by Antoine Faustus Nairon, a
                - link "Maronite" [ref=f2e358] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Maronite
                - text: professor of Oriental languages and author of one of the first printed treatises devoted to coffee,
                - generic "Latin-language text" [ref=f2e359]: De Saluberrima potione Cahue seu Cafe nuncupata Discurscus
                - text: (Rome, 1671), which describes a camel or goat herder in the Kingdom of Ayaman, Arabia Felix.
                - superscript [ref=f2e360]:
                  - link "[17]" [ref=f2e361] [cursor=pointer]:
                    - /url: "#cite_note-Ukers1935_AyamanArabiaFelix-17"
                - superscript [ref=f2e363]:
                  - link "[18]" [ref=f2e364] [cursor=pointer]:
                    - /url: "#cite_note-18"
                - superscript [ref=f2e366]:
                  - link "[19]" [ref=f2e367] [cursor=pointer]:
                    - /url: "#cite_note-19"
                - superscript [ref=f2e369]:
                  - link "[4]" [ref=f2e370] [cursor=pointer]:
                    - /url: "#cite_note-Wein34-4"
                - text: The herder is unnamed in the earliest account and the name Kaldi appears to be a later invention from the twentieth century.
                - superscript [ref=f2e372]:
                  - link "[20]" [ref=f2e373] [cursor=pointer]:
                    - /url: "#cite_note-20"
                - text: Another legend attributes the discovery of coffee to a Sheikh Omar. Starving after being exiled from Mokha, Omar found berries. After attempting to chew and roast them, Omar boiled them, which yielded a liquid that revitalized and sustained him.
                - superscript [ref=f2e375]:
                  - link "[1]" [ref=f2e376] [cursor=pointer]:
                    - /url: "#cite_note-ukers-1"
            - region [ref=f2e378]:
              - heading "Historical transmission" [level=3] [ref=f2e380]
              - figure "A 1652 handbill advertising coffee for sale in St. Michael's Alley, London" [ref=f2e381]:
                - link [ref=f2e382] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:The_Vertue_of_the_COFFEE_Drink.jpg
              - paragraph [ref=f2e385]:
                - text: The earliest possible references to the
                - link "coffee bean" [ref=f2e386] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_bean
                - text: and its qualities appear in
                - link "al-Razi" [ref=f2e387] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Abu_Bakr_al-Razi
                - text: "'s 10th-century"
                - link "al-Hawi" [ref=f2e389] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Al-Hawi
                - superscript [ref=f2e390]:
                  - link "[a]" [ref=f2e391] [cursor=pointer]:
                    - /url: "#cite_note-21"
                - text: and in
                - link "Avicenna" [ref=f2e393] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Avicenna
                - text: "'s 11th-century"
                - link "The Canon of Medicine" [ref=f2e395] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/The_Canon_of_Medicine
                - superscript [ref=f2e396]:
                  - link "[21]" [ref=f2e397] [cursor=pointer]:
                    - /url: "#cite_note-22"
                - superscript [ref=f2e399]:
                  - link "[b]" [ref=f2e400] [cursor=pointer]:
                    - /url: "#cite_note-23"
                - text: both which describe a plant component called bunchum as
                - link "hot and dry" [ref=f2e402] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Classical_element#Aristotle
                - superscript [ref=f2e403]:
                  - link "[c]" [ref=f2e404] [cursor=pointer]:
                    - /url: "#cite_note-24"
                - text: —with al-Razi reporting beneficial effects for the stomach and Ibn Sina also adding claims for the skin and body odor. According to later accounts, bunchum was made from a root rather than from coffee beans.
                - superscript [ref=f2e406]:
                  - link "[22]" [ref=f2e407] [cursor=pointer]:
                    - /url: "#cite_note-:0-25"
                - superscript [ref=f2e409]:
                  - link "[23]" [ref=f2e410] [cursor=pointer]:
                    - /url: "#cite_note-Dufour_1684-26"
                - text: There is no confirmed evidence, either historical or archaeological, of coffee as a drink being consumed before the 15th century. The drink appears to be a relatively recent development. By the late 15th century, coffee drinking was well established among Sufi communities in Yemen.
                - superscript [ref=f2e412]:
                  - link "[22]" [ref=f2e413] [cursor=pointer]:
                    - /url: "#cite_note-:0-25"
                - superscript [ref=f2e415]:
                  - link "[24]" [ref=f2e416] [cursor=pointer]:
                    - /url: "#cite_note-27"
              - paragraph [ref=f2e418]:
                - text: An early writer on coffee was
                - link "Abd al-Qadir al-Jaziri" [ref=f2e419] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Abd_al-Qadir_al-Jaziri?action=edit&redlink=1
                - text: of
                - link "Ottoman Iraq" [ref=f2e420] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ottoman_Iraq
                - text: ", who in 1587 compiled a work tracing the history and legal controversies of coffee in his ʿUmdat al-ṣafwa fī ḥill al-qahwa ("
                - generic "Arabic-language text" [ref=f2e421]: عمدة الصفوة في حل القهوة
                - text: ), in which he claims that the coffee bean originated in the "land of
                - link "Sa'ad ad-Din" [ref=f2e422] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sa'ad_ad-Din_II
                - text: ", and the country of"
                - link "Abyssinia" [ref=f2e423] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Abyssinia
                - text: ", and of the"
                - link "Jabart" [ref=f2e424] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jabarti
                - text: ", and other places of the land of ‘"
                - link "Ajam" [ref=f2e425] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ajam
                - text: ", but the time of its first use is unknown, nor do we know the reason.\" Al-Jazīrī asserts that coffee was introduced to"
                - link "Cairo" [ref=f2e426] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cairo
                - text: at the start of the 16th century by Sufi devotees.
                - superscript [ref=f2e427]:
                  - link "[25]" [ref=f2e428] [cursor=pointer]:
                    - /url: "#cite_note-28"
              - paragraph [ref=f2e430]:
                - text: Coffee appears to have been likely collected from wild, with some indications that its use expanded from the 14th century among certain Islamized groups in southeastern Ethiopia, though direct evidence for early consumption remains scarce. The use of coffee is believed to have spread across the Red Sea to the
                - link "Rasulid" [ref=f2e431] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rasulid_dynasty
                - text: sultanate of Yemen, who maintained cultural and commercial ties with the
                - link "Adal Sultanate" [ref=f2e432] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Adal_Sultanate
                - text: . Its consumption first appears in Yemen, particularly in regions such as
                - link "Aden" [ref=f2e433] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aden
                - text: ","
                - link "Mocha" [ref=f2e434] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mokha
                - text: and
                - link "Zabid" [ref=f2e435] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zabid
                - text: during the 15th century.
                - superscript [ref=f2e436]:
                  - link "[26]" [ref=f2e437] [cursor=pointer]:
                    - /url: "#cite_note-29"
                - superscript [ref=f2e439]:
                  - link "[27]" [ref=f2e440] [cursor=pointer]:
                    - /url: "#cite_note-30"
                - text: The 16th-century scholar
                - link "Ibn Hajar al-Haytami" [ref=f2e442] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ibn_Hajar_al-Haytami
                - text: writes about the plant's development from a tree in the
                - link "Zeila region" [ref=f2e443] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zeila_(historical_region)
                - text: .
                - superscript [ref=f2e444]:
                  - link "[28]" [ref=f2e445] [cursor=pointer]:
                    - /url: "#cite_note-31"
                - text: In 1542, a Portuguese crew met with a ship from
                - link "Zeila" [ref=f2e447] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Zeila
                - text: transporting clarified butter and coffee to
                - link "Al-Shihr" [ref=f2e448] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Al-Shihr
                - text: in Yemen.
                - superscript [ref=f2e449]:
                  - link "[29]" [ref=f2e450] [cursor=pointer]:
                    - /url: "#cite_note-32"
              - figure [ref=f2e452]:
                - link [ref=f2e453] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Leo_Ruben,_1897,_Sarajevo.jpg
                - generic [ref=f2e455]:
                  - text: Coffee is an important part of
                  - link "Bosnian culture" [ref=f2e456] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Culture_of_Bosnia_and_Herzegovina
                  - text: ", and was a major part of its economy in the past."
                  - superscript [ref=f2e457]:
                    - link "[30]" [ref=f2e458] [cursor=pointer]:
                      - /url: "#cite_note-Bosnian_coffee-Cohen-BBC-2014-33"
              - paragraph [ref=f2e460]:
                - text: Other sources of coffee drinking or knowledge of the coffee tree appear in the middle of the 15th century in the accounts of Ahmed al-Ghaffar in Yemen,
                - superscript [ref=f2e461]:
                  - link "[4]" [ref=f2e462] [cursor=pointer]:
                    - /url: "#cite_note-Wein34-4"
                - text: where coffee seeds were first roasted and brewed in a similar way to how it is prepared now. Coffee was used by Sufi circles to stay awake for their religious rituals.
                - superscript [ref=f2e464]:
                  - link "[31]" [ref=f2e465] [cursor=pointer]:
                    - /url: "#cite_note-encyclopedia-of-islam-kawah-34"
                - text: Accounts differ on the origin of the coffee plant before its appearance in Yemen. Coffee may have been introduced to Yemen from Ethiopia via the
                - link "Red Sea" [ref=f2e467] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Red_Sea
                - text: trade.
                - superscript [ref=f2e468]:
                  - link "[32]" [ref=f2e469] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTESouza20083-35"
                - text: One account credits Muhammad Ibn Sa'd al-Dhabḥani for bringing coffee to Aden from the Somali coast,
                - superscript [ref=f2e471]:
                  - link "[33]" [ref=f2e472] [cursor=pointer]:
                    - /url: "#cite_note-Hattox-1985-36"
                - text: other early accounts say Ali ben Omar of the
                - link "Shadhili" [ref=f2e474] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Shadhili
                - text: Sufi order was the first to introduce coffee to Arabia.
                - superscript [ref=f2e475]:
                  - link "[33]" [ref=f2e476] [cursor=pointer]:
                    - /url: "#cite_note-Hattox-1985-36"
                - superscript [ref=f2e478]:
                  - link "[34]" [ref=f2e479] [cursor=pointer]:
                    - /url: "#cite_note-37"
                - superscript [ref=f2e481]:
                  - link "[31]" [ref=f2e482] [cursor=pointer]:
                    - /url: "#cite_note-encyclopedia-of-islam-kawah-34"
                - text: By the 16th century, coffee had reached the rest of the Middle East and North Africa.
                - superscript [ref=f2e484]:
                  - link "[35]" [ref=f2e485] [cursor=pointer]:
                    - /url: "#cite_note-38"
              - paragraph [ref=f2e487]:
                - text: In 1583,
                - link "Leonhard Rauwolf" [ref=f2e488] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Leonhard_Rauwolf
                - text: ", a German physician, gave this description of coffee after returning from a ten-year trip to the Near East:"
              - blockquote [ref=f2e489]:
                - paragraph [ref=f2e490]: A beverage as black as ink, useful against numerous illnesses, particularly those of the stomach. Its consumers take it in the morning, quite frankly, in a porcelain cup passed around and from which each one drinks a cupful. It is composed of water and the fruit from a bush called bunnu.
              - paragraph [ref=f2e492]:
                - text: — Léonard Rauwolf,
                - generic "German-language text" [ref=f2e493]: Reise in die Morgenländer
                - text: (in German)
              - paragraph [ref=f2e494]:
                - text: Within the
                - link "Ottoman Empire" [ref=f2e495] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Ottoman_Empire
                - text: ", the first coffeehouse opened in 1555 in Tahtakale, Istanbul."
                - superscript [ref=f2e496]:
                  - link "[36]" [ref=f2e497] [cursor=pointer]:
                    - /url: "#cite_note-:1-39"
                - text: Since Tahtakale is to the West of the
                - link "Bosporus" [ref=f2e499] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bosporus
                - text: ", this would likely have been the first coffee house in Europe. Thriving trade brought many goods, including coffee, from the Ottoman Empire to Venice. Coffee became more widely accepted in Europe after"
                - link "Pope Clement VIII" [ref=f2e500] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pope_Clement_VIII
                - text: declared it a Christian beverage in 1600, despite appeals to ban the "Muslim drink".
                - link "Coffee had spread to Italy" [ref=f2e501] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_in_Italy
                - text: by 1600 and then to the rest of Europe, Indonesia, and the Americas.
                - superscript [ref=f2e502]:
                  - link "[37]" [ref=f2e503] [cursor=pointer]:
                    - /url: "#cite_note-40"
                - text: The first European
                - link "coffeehouse" [ref=f2e505] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffeehouse
                - text: outside of the Ottoman Empire opened in Venice in 1647.
                - superscript [ref=f2e506]:
                  - link "[38]" [ref=f2e507] [cursor=pointer]:
                    - /url: "#cite_note-41"
            - region [ref=f2e509]:
              - heading "As a colonial import" [level=3] [ref=f2e511]
              - generic [ref=f2e514]:
                - generic [ref=f2e515]:
                  - link [ref=f2e518] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Mason's_essence_of_coffee_and_chicory_advert.jpg
                  - generic [ref=f2e520]: A late 19th-century advertisement for coffee essence
                - generic [ref=f2e521]:
                  - link [ref=f2e524] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Washington_Coffee_New_York_Tribune.JPG
                  - generic [ref=f2e526]:
                    - text: A 1919 advertisement for
                    - generic [ref=f2e527]: G Washington's Coffee
                    - text: . The inventor
                    - link "George Washington" [ref=f2e528] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/George_Washington_(inventor)
                    - text: developed methods for large scale commercial manufacture of instant coffee.
              - paragraph [ref=f2e529]:
                - text: The
                - link "Dutch East India Company" [ref=f2e530] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Dutch_East_India_Company
                - text: was the first to import coffee on a large scale.
                - superscript [ref=f2e531]:
                  - link "[1]" [ref=f2e532] [cursor=pointer]:
                    - /url: "#cite_note-ukers-1"
                - text: The Dutch later grew the crop in Java and Ceylon.
                - superscript [ref=f2e534]:
                  - link "[39]" [ref=f2e535] [cursor=pointer]:
                    - /url: "#cite_note-plant-42"
                - text: The first exports of
                - link "Indonesian coffee" [ref=f2e537] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_production_in_Indonesia
                - text: from Java to the Netherlands occurred in 1711.
                - superscript [ref=f2e538]:
                  - link "[40]" [ref=f2e539] [cursor=pointer]:
                    - /url: "#cite_note-43"
              - paragraph [ref=f2e541]:
                - text: Through the efforts of the
                - link "British East India Company" [ref=f2e542] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Honourable_East_India_Company
                - text: ", coffee became popular in England. In a diary entry of May 1637,"
                - link "John Evelyn" [ref=f2e543] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/John_Evelyn
                - text: records tasting the drink at
                - link "Oxford" [ref=f2e544] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Oxford
                - text: ", where it had been brought by a student of"
                - link "Balliol College" [ref=f2e545] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Balliol_College,_Oxford
                - text: from
                - link "Crete" [ref=f2e546] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Crete
                - text: named Nathaniel Conopios of Crete.
                - superscript [ref=f2e547]:
                  - link "[41]" [ref=f2e548] [cursor=pointer]:
                    - /url: "#cite_note-44"
                - superscript [ref=f2e550]:
                  - link "[42]" [ref=f2e551] [cursor=pointer]:
                    - /url: "#cite_note-45"
                - text: Oxford's
                - link "Queen's Lane Coffee House" [ref=f2e553] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Queen's_Lane_Coffee_House
                - text: ", established in 1654, is still in existence today. Coffee was introduced in France in 1657 and in Austria and Poland after the 1683"
                - link "Battle of Vienna" [ref=f2e554] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Battle_of_Vienna
                - text: ", when coffee was captured from supplies of the defeated Turks."
                - superscript [ref=f2e555]:
                  - link "[43]" [ref=f2e556] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast20019-46"
              - paragraph [ref=f2e558]:
                - text: When coffee reached North America during the Colonial period, it was initially not as successful as in Europe, as alcoholic beverages remained more popular. During the Revolutionary War, the demand for coffee increased so much that dealers had to hoard their scarce supplies and raise prices dramatically; this was also due to the reduced availability of tea from British merchants,
                - superscript [ref=f2e559]:
                  - link "[44]" [ref=f2e560] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200139-47"
                - text: and a general resolution among many Americans to avoid drinking tea following the 1773
                - link "Boston Tea Party" [ref=f2e562] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Boston_Tea_Party
                - text: .
                - superscript [ref=f2e563]:
                  - link "[45]" [ref=f2e564] [cursor=pointer]:
                    - /url: "#cite_note-48"
              - paragraph [ref=f2e566]:
                - text: During the 18th century, coffee consumption declined in Britain, giving way to
                - link "tea drinking" [ref=f2e567] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tea_culture
                - text: .
                - link "Tea" [ref=f2e568] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tea
                - text: was simpler to make and had become cheaper with the British conquest of India and the tea industry there.
                - superscript [ref=f2e569]:
                  - link "[46]" [ref=f2e570] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200113-49"
                - text: During the
                - link "Age of Sail" [ref=f2e572] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Age_of_Sail
                - text: ", seamen aboard ships of the British Royal Navy made substitute coffee by dissolving burnt bread in hot water."
                - superscript [ref=f2e573]:
                  - link "[47]" [ref=f2e574] [cursor=pointer]:
                    - /url: "#cite_note-Fremont-Barnes2005-50"
                - text: According to Captain Haines, who was the colonial administrator of
                - link "Aden" [ref=f2e576] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Aden
                - text: (1839–1854), Mokha historically imported up to two-thirds of its coffee from Berbera-based merchants before the coffee trade of Mokha was captured by British-controlled Aden in the 19th century. After that, much of the Ethiopian coffee was exported to Aden via Berbera.
                - superscript [ref=f2e577]:
                  - link "[48]" [ref=f2e578] [cursor=pointer]:
                    - /url: "#cite_note-51"
              - paragraph [ref=f2e580]:
                - text: Frenchman
                - link "Gabriel de Clieu" [ref=f2e581] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gabriel_de_Clieu
                - text: took a coffee plant to the French territory of
                - link "Martinique" [ref=f2e582] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Martinique
                - text: in the Caribbean in the 1720s,
                - superscript [ref=f2e583]:
                  - link "[49]" [ref=f2e584] [cursor=pointer]:
                    - /url: "#cite_note-52"
                - text: from which much of the world's cultivated arabica coffee is descended. Coffee thrived in the climate and was conveyed across the Americas.
                - superscript [ref=f2e586]:
                  - link "[50]" [ref=f2e587] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200114-53"
                - text: Coffee was cultivated in
                - link "Saint-Domingue" [ref=f2e589] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Saint-Domingue
                - text: ", now Haiti, from 1734, and by 1788 it supplied half the world's coffee."
                - superscript [ref=f2e590]:
                  - link "[51]" [ref=f2e591] [cursor=pointer]:
                    - /url: "#cite_note-Pendergrast_2010-54"
                - text: The conditions that the enslaved people worked in on coffee plantations were a factor in the
                - link "Haitian Revolution" [ref=f2e593] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Haitian_Revolution
                - text: ", and the coffee industry never fully recovered there."
                - superscript [ref=f2e594]:
                  - link "[52]" [ref=f2e595] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200116-55"
            - region [ref=f2e597]:
              - heading "Mass production" [level=3] [ref=f2e599]
              - figure [ref=f2e600]:
                - link [ref=f2e601] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Mocha1692.jpg
                - generic [ref=f2e603]:
                  - text: The port city
                  - link "Mocha" [ref=f2e604] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mokha
                  - text: in Yemen 1692.
              - paragraph [ref=f2e605]:
                - text: In the late 16th century, Yemen developed a booming coffee economy. Farmers grew coffee on mountain terraces above the
                - link "Tihamah" [ref=f2e606] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tihamah
                - text: plain, and trade routes linked its ports to
                - link "Jeddah" [ref=f2e607] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Jeddah
                - text: and Cairo. By the 17th century, coffee had surpassed the global
                - link "spice trade" [ref=f2e608] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Spice_trade
                - text: .
                - superscript [ref=f2e609]:
                  - link "[53]" [ref=f2e610] [cursor=pointer]:
                    - /url: "#cite_note-:3-56"
                - text: Up to the end of the 17th century, Yemen was the world's main producer for coffee, and
                - link "Mocha" [ref=f2e612] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mokha
                - text: was the world's largest shipping port for coffee.
                - superscript [ref=f2e613]:
                  - link "[6]" [ref=f2e614] [cursor=pointer]:
                    - /url: "#cite_note-:2-6"
                - superscript [ref=f2e616]:
                  - link "[54]" [ref=f2e617] [cursor=pointer]:
                    - /url: "#cite_note-57"
              - figure [ref=f2e619]:
                - link [ref=f2e620] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:MODOGlendora.jpg
                - generic [ref=f2e622]:
                  - text: A coffee can from the first half of the 20th century. From the
                  - link "Museo del Objeto del Objeto" [ref=f2e623] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Museo_del_Objeto_del_Objeto
                  - text: collection.
              - paragraph [ref=f2e624]:
                - text: Coffee was
                - link "introduced to Brazil" [ref=f2e625] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_production_in_Brazil#History
                - text: in 1727, but its cultivation did not gather momentum until independence in 1822.
                - superscript [ref=f2e626]:
                  - link "[55]" [ref=f2e627] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200119-58"
                - text: After this time, massive tracts of
                - link "rainforest" [ref=f2e629] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Atlantic_Forest
                - text: were cleared for coffee plantations, first around
                - link "Rio de Janeiro" [ref=f2e630] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rio_de_Janeiro
                - text: and later
                - link "São Paulo" [ref=f2e631] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/São_Paulo
                - text: .
                - superscript [ref=f2e632]:
                  - link "[56]" [ref=f2e633] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200120–24-59"
                - text: Brazil went from having essentially no coffee exports in 1800 to being a significant regional producer in 1830, to being the largest producer in the world by 1852. Between 1910 and 1920, Brazil exported around 70% of the world's coffee; Colombia, Guatemala, and Venezuela exported 15%; and Old World production accounted for less than 5% of world exports.
                - superscript [ref=f2e635]:
                  - link "[57]" [ref=f2e636] [cursor=pointer]:
                    - /url: "#cite_note-stats1920-60"
              - paragraph [ref=f2e638]:
                - text: Many countries in Central America took up cultivation in the latter half of the 19th century, and almost all were involved in the large-scale displacement and exploitation of indigenous people. Harsh conditions led to many uprisings, coups, and bloody suppression of peasants.
                - superscript [ref=f2e639]:
                  - link "[58]" [ref=f2e640] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200133–34-61"
                - text: The notable exception was Costa Rica, where a lack of ready labor prevented the formation of large farms. Smaller farms and more egalitarian conditions ameliorated unrest over the 19th and 20th centuries.
                - superscript [ref=f2e642]:
                  - link "[59]" [ref=f2e643] [cursor=pointer]:
                    - /url: "#cite_note-FOOTNOTEPendergrast200135–36-62"
              - paragraph [ref=f2e645]:
                - text: Rapid growth in coffee production in South America during the second half of the 19th century was matched by an increase in consumption in developed countries. Nowhere was this growth been as pronounced as in the United States, where a high rate of population growth was compounded by doubling of per capita consumption between 1860 and 1920. Though the United States was not the heaviest coffee-drinking nation at the time (Belgium, the Netherlands and Nordic countries all had comparable or higher levels of per capita consumption), due to its sheer size, the US was already the largest consumer of coffee in the world by 1860. By 1920, around half of all coffee produced worldwide was consumed in the US.
                - superscript [ref=f2e646]:
                  - link "[57]" [ref=f2e647] [cursor=pointer]:
                    - /url: "#cite_note-stats1920-60"
              - paragraph [ref=f2e649]:
                - text: Coffee has become a vital
                - link "cash crop" [ref=f2e650] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cash_crop
                - text: for many developing countries. Over 100 million people in developing countries have become dependent on coffee as their primary source of income. It has become the primary export and economic backbone for African countries like Uganda, Burundi, Rwanda, and Ethiopia,
                - superscript [ref=f2e651]:
                  - link "[60]" [ref=f2e652] [cursor=pointer]:
                    - /url: "#cite_note-Ethiopiacoffetrade-63"
                - text: as well as many Central American countries.
              - figure "Coffee bean production, 2023" [ref=f2e654]:
                - link:
                  - /url: https://en.wikipedia.org/wiki/File:Coffee_bean_production,_World,_2023_(cropped).svg
          - region [ref=f2e658]:
            - heading "Biology" [level=2] [ref=f2e660]
            - note [ref=f2e661]:
              - text: "Further information:"
              - link "List of coffee varieties" [ref=f2e662] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_coffee_varieties
            - paragraph [ref=f2e663]:
              - text: Several species of shrub of the genus
              - link "Coffea" [ref=f2e665] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffea
              - text: produce the berries from which coffee is extracted. The two main species commercially cultivated are
              - link "C. canephora" [ref=f2e667] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffea_canephora
              - text: (predominantly a form known as 'robusta') and
              - link "C. arabica" [ref=f2e669] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffea_arabica
              - text: .
              - superscript [ref=f2e670]:
                - link "[61]" [ref=f2e671] [cursor=pointer]:
                  - /url: "#cite_note-ICO-64"
              - text: C. arabica, the most highly regarded species, is native to the southwestern highlands of Ethiopia, the
              - link "Boma Plateau" [ref=f2e673] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Boma_Plateau
              - text: in southeastern Sudan, and
              - link "Mount Marsabit" [ref=f2e674] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mount_Marsabit
              - text: in northern Kenya.
              - superscript [ref=f2e675]:
                - link "[62]" [ref=f2e676] [cursor=pointer]:
                  - /url: "#cite_note-65"
              - text: C. canephora is native to western and central Subsaharan Africa, from Guinea to Uganda and southern Sudan.
              - superscript [ref=f2e678]:
                - link "[63]" [ref=f2e679] [cursor=pointer]:
                  - /url: "#cite_note-66"
              - text: Less popular species are
              - link "C. liberica" [ref=f2e682] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffea_liberica
              - text: ","
              - link "C. stenophylla" [ref=f2e684] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffea_stenophylla
              - text: ", C. mauritiana, and C. racemosa."
            - paragraph [ref=f2e685]:
              - text: All coffee plants are classified in the family
              - link "Rubiaceae" [ref=f2e686] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rubiaceae
              - text: . They are evergreen shrubs or trees that may grow 5 m (15 ft) tall when unpruned. The leaves are dark green and glossy, usually 10–15 cm (4–6 in) long and 6 cm (2.4 in) wide, simple, entire, and opposite.
              - link "Petioles" [ref=f2e687] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Petiole_(botany)
              - text: of opposite leaves fuse at the base to form interpetiolar
              - link "stipules" [ref=f2e688] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Stipules
              - text: ", characteristic of Rubiaceae. The flowers are"
              - link "axillary" [ref=f2e689] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Leaf#Morphology_(large-scale_features)
              - text: ", and clusters of fragrant white flowers bloom simultaneously."
              - link "Gynoecium" [ref=f2e690] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gynoecium
              - text: consists of an inferior ovary, also characteristic of Rubiaceae. The flowers are followed by oval berries of about 1.5 cm (0.6 in).
              - superscript [ref=f2e691]:
                - link "[64]" [ref=f2e692] [cursor=pointer]:
                  - /url: "#cite_note-Purdue-67"
              - text: When immature, they are green, and they ripen to yellow, then crimson, before turning black on drying. Each berry usually contains two seeds, but 5–10% of the berries
              - superscript [ref=f2e694]:
                - link "[65]" [ref=f2e695] [cursor=pointer]:
                  - /url: "#cite_note-68"
              - text: have only one; these are called
              - link "peaberries" [ref=f2e697] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Peaberry
              - text: .
              - superscript [ref=f2e698]:
                - link "[66]" [ref=f2e699] [cursor=pointer]:
                  - /url: "#cite_note-69"
              - text: Arabica berries ripen in six to eight months, while robusta takes nine to eleven months.
              - superscript [ref=f2e701]:
                - link "[67]" [ref=f2e702] [cursor=pointer]:
                  - /url: "#cite_note-PradeepkumarPradeep2008-70"
            - paragraph [ref=f2e704]:
              - text: C. arabica is predominantly self-pollinating, and as a result the seedlings are generally uniform and vary little from their parents. In contrast, C. canephora and C. liberica are self-incompatible and require
              - link "outcrossing" [ref=f2e705] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Outcrossing
              - text: . This means that useful forms and hybrids must be propagated
              - link "vegetatively" [ref=f2e706] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Vegetative_reproduction
              - text: .
              - superscript [ref=f2e707]:
                - link "[68]" [ref=f2e708] [cursor=pointer]:
                  - /url: "#cite_note-CW158-71"
              - text: Cuttings, grafting, and budding are the usual methods of vegetative propagation.
              - superscript [ref=f2e710]:
                - link "[69]" [ref=f2e711] [cursor=pointer]:
                  - /url: "#cite_note-CW1612-72"
              - text: On the other hand, there is great scope for experimentation in search of potential new strains.
              - superscript [ref=f2e713]:
                - link "[68]" [ref=f2e714] [cursor=pointer]:
                  - /url: "#cite_note-CW158-71"
            - list [ref=f2e716]:
              - listitem [ref=f2e717]:
                - link [ref=f2e720] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Coffea_arabica_-_Köhler–s_Medizinal-Pflanzen-189_(cropped).jpg
                  - img "Illustration of a single branch of a plant. Broad, ribbed leaves are accented by small white flowers at the base of the stalk. On the edge of the drawing are cutaway diagrams of parts of the plant." [ref=f2e721]
                - generic [ref=f2e722]:
                  - text: Illustration of
                  - link "C. arabica" [ref=f2e724] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coffea_arabica
                  - text: plant and seeds
              - listitem [ref=f2e725]:
                - link [ref=f2e728] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Coffee_flowers.jpg
                  - img "C. robusta flowers" [ref=f2e729]
                - generic [ref=f2e730]: C. robusta flowers
              - listitem [ref=f2e731]:
                - link [ref=f2e734] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Coffee_Flowers_Show.jpg
                  - img "A flowering C. arabica tree" [ref=f2e735]
                - generic [ref=f2e736]: A flowering C. arabica tree
              - listitem [ref=f2e737]:
                - link [ref=f2e740] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Coffee_berries.jpg
                  - img "C. arabica berries on the bush" [ref=f2e741]
                - generic [ref=f2e742]: C. arabica berries on the bush
          - region [ref=f2e743]:
            - heading "Cultivation and production" [level=2] [ref=f2e745]
            - note [ref=f2e746]:
              - text: "Further information:"
              - link "Coffee production" [ref=f2e747] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_production
              - text: and
              - link "List of countries by coffee production" [ref=f2e748] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_countries_by_coffee_production
            - 'figure "A map of global coffee cultivation: r Coffea canephora m Coffea canephora and Coffea arabica a Coffea arabica" [ref=f2e749]':
              - link [ref=f2e750] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/File:Carte_Coffea_robusta_arabic.svg
              - generic [ref=f2e752]:
                - text: "A map of global coffee cultivation:"
                - generic [ref=f2e753]:
                  - generic [ref=f2e754]: r
                  - link "Coffea canephora" [ref=f2e756] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coffea_canephora
                - generic [ref=f2e757]:
                  - generic [ref=f2e758]: m
                  - text: Coffea canephora and
                  - link "Coffea arabica" [ref=f2e760] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coffea_arabica
                - generic [ref=f2e761]:
                  - generic [ref=f2e762]: a
                  - text: Coffea arabica
            - paragraph [ref=f2e763]:
              - text: The traditional method of planting coffee is to place 20 seeds in each hole at the beginning of the
              - link "rainy season" [ref=f2e764] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Wet_season
              - text: . This method loses about 50% of the seeds' potential, as about half fail to sprout. A more effective process of growing coffee, used in Brazil, is to raise seedlings in nurseries that are then planted outside after six to twelve months. Coffee is often
              - link "intercropped" [ref=f2e765] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Intercropping
              - text: with food crops, such as corn, beans, or rice during the first few years of cultivation as farmers become familiar with its requirements.
              - superscript [ref=f2e766]:
                - link "[64]" [ref=f2e767] [cursor=pointer]:
                  - /url: "#cite_note-Purdue-67"
              - text: Coffee plants grow within a defined area between the tropics of Cancer and Capricorn, termed the bean belt or coffee belt.
              - superscript [ref=f2e769]:
                - link "[70]" [ref=f2e770] [cursor=pointer]:
                  - /url: "#cite_note-73"
            - paragraph [ref=f2e772]:
              - text: In 2020, the world production of green coffee beans was 175,647,000 60 kg bags, led by Brazil with 39% of the total, followed by Vietnam, Colombia, and Indonesia.
              - superscript [ref=f2e773]:
                - link "[71]" [ref=f2e774] [cursor=pointer]:
                  - /url: "#cite_note-ico-2020report-74"
              - text: Brazil is the largest coffee exporting nation, accounting for 15% of all world exports in 2019.
              - superscript [ref=f2e776]:
                - link "[72]" [ref=f2e777] [cursor=pointer]:
                  - /url: "#cite_note-workman-75"
              - text: As of 2021, no
              - link "synthetic coffee" [ref=f2e779] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Coffee_substitute#Synthetic_coffee
              - text: products are publicly available but multiple
              - link "bioeconomy" [ref=f2e780] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bioeconomy
              - text: companies have reportedly produced first batches that are highly similar on the molecular level and are close to commercialization.
              - superscript [ref=f2e781]:
                - link "[73]" [ref=f2e782] [cursor=pointer]:
                  - /url: "#cite_note-synthcoffee-76"
              - superscript [ref=f2e784]:
                - link "[74]" [ref=f2e785] [cursor=pointer]:
                  - /url: "#cite_note-77"
              - superscript [ref=f2e787]:
                - link "[75]" [ref=f2e788] [cursor=pointer]:
                  - /url: "#cite_note-labgrown-78"
            - region [ref=f2e790]:
              - heading "Species variations" [level=3] [ref=f2e792]
              - paragraph [ref=f2e793]:
                - text: Of the two main species grown, arabica coffee (from C. arabica) is generally more highly regarded than robusta coffee (from C. canephora). Robusta coffee tends to be bitter and has less flavor but a better body than arabica. For these reasons, about three-quarters of the coffee cultivated worldwide is C. arabica.
                - superscript [ref=f2e794]:
                  - link "[61]" [ref=f2e795] [cursor=pointer]:
                    - /url: "#cite_note-ICO-64"
                - text: Robusta strains contain about 40–50% more caffeine than arabica.
                - superscript [ref=f2e797]:
                  - link "[76]" [ref=f2e798] [cursor=pointer]:
                    - /url: "#cite_note-EA763-79"
                - text: Consequently, this species is used as an inexpensive substitute for arabica in many commercial coffee blends. Good quality robusta beans are used in traditional Italian
                - link "espresso" [ref=f2e800] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Espresso
                - text: blends to provide a full-bodied taste and a better foam head (known as crema).
              - figure [ref=f2e801]:
                - link [ref=f2e802] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Hemileia_vastatrix_-_coffee_leaf_rust.jpg
                - generic [ref=f2e804]:
                  - link "Coffee leaf rust" [ref=f2e805] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coffee_leaf_rust
                  - text: has forced the cultivation of resistant robusta coffee in many countries.
                  - superscript [ref=f2e806]:
                    - link "[77]" [ref=f2e807] [cursor=pointer]:
                      - /url: "#cite_note-van_der_Vossen_1985-80"
              - paragraph [ref=f2e809]:
                - text: Robusta is less susceptible to disease than arabica and can be cultivated in lower altitudes and warmer climates where arabica does not thrive.
                - superscript [ref=f2e810]:
                  - link "[78]" [ref=f2e811] [cursor=pointer]:
                    - /url: "#cite_note-DavironPonte2005-81"
                - text: The robusta strain was first collected in 1890 from the
                - link "Lomani River" [ref=f2e813] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Lomani_River
                - text: ", a tributary of the Congo River, and was conveyed from the Congo Free State (now the Democratic Republic of the Congo) to Brussels to Java around 1900. From Java, further breeding resulted in the establishment of robusta plantations in many countries."
                - superscript [ref=f2e814]:
                  - link "[77]" [ref=f2e815] [cursor=pointer]:
                    - /url: "#cite_note-van_der_Vossen_1985-80"
                - text: In particular, the spread of the devastating coffee leaf rust, caused by the fungal pathogen
                - link "Hemileia vastatrix" [ref=f2e818] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hemileia_vastatrix
                - text: ", hastened the uptake of the resistant robusta. The pathogen results in light, rust-colored spots on the undersides of coffee plant leaves."
                - superscript [ref=f2e819]:
                  - link "[79]" [ref=f2e820] [cursor=pointer]:
                    - /url: "#cite_note-82"
                - text: It grows exclusively on the leaves of coffee plants.
                - superscript [ref=f2e822]:
                  - link "[80]" [ref=f2e823] [cursor=pointer]:
                    - /url: "#cite_note-83"
                - text: Coffee leaf rust is found in virtually all countries that produce coffee.
                - superscript [ref=f2e825]:
                  - link "[81]" [ref=f2e826] [cursor=pointer]:
                    - /url: "#cite_note-84"
              - paragraph [ref=f2e828]:
                - text: Beans from different countries or regions can usually be distinguished by differences in flavor, aroma, body, and acidity.
                - superscript [ref=f2e829]:
                  - link "[82]" [ref=f2e830] [cursor=pointer]:
                    - /url: "#cite_note-85"
                - text: These taste characteristics are dependent on the coffee's growing region, genetic subspecies (
                - link "varietals" [ref=f2e832] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Variety_(biology)
                - text: ), and processing.
                - superscript [ref=f2e833]:
                  - link "[83]" [ref=f2e834] [cursor=pointer]:
                    - /url: "#cite_note-castle-86"
                - text: Varietals are generally known by the region in which they are grown, such as
                - link "Colombian" [ref=f2e836] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Colombian_coffee
                - text: ","
                - link "Java" [ref=f2e837] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Java_coffee
                - text: ", and"
                - link "Kona" [ref=f2e838] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kona_coffee
                - text: . Arabica coffee beans are cultivated mainly in Latin America, eastern Africa or Asia, while robusta beans are grown in central Africa, southeast Asia, and Brazil.
                - superscript [ref=f2e839]:
                  - link "[61]" [ref=f2e840] [cursor=pointer]:
                    - /url: "#cite_note-ICO-64"
            - region [ref=f2e842]:
              - heading "Pests and treatments" [level=3] [ref=f2e844]
              - region [ref=f2e845]:
                - heading "Fungi" [level=4] [ref=f2e847]
                - figure [ref=f2e848]:
                  - link [ref=f2e849] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Coffee_Wilt_Disease.jpg
                  - generic [ref=f2e851]:
                    - text: A Robusta coffee tree infected by
                    - link "coffee wilt disease" [ref=f2e852] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Coffee_wilt_disease
                - paragraph [ref=f2e853]:
                  - link "Coffee wilt disease" [ref=f2e854] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coffee_wilt_disease
                  - text: or tracheomycosis is a common vascular
                  - link "wilt" [ref=f2e855] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Wilt_disease
                  - text: found in Eastern and Central Africa that can kill coffee trees it infects. It is induced by the fungal pathogen
                  - link "Gibberella xylarioides" [ref=f2e857] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Gibberella_xylarioides
                  - text: . It can affect several Coffea species and could potentially threaten production worldwide.
                  - superscript [ref=f2e858]:
                    - link "[84]" [ref=f2e859] [cursor=pointer]:
                      - /url: "#cite_note-Hindorf_Omondi_2011-87"
                  - link "Mycena citricolor" [ref=f2e862] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Mycena_citricolor
                  - text: ", American leaf spot, is a fungus that can affect the entire coffee plant. It grows on leaves, resulting in leaves with holes that often fall from the plant. It is a threat primarily in Latin America."
                  - superscript [ref=f2e863]:
                    - link "[85]" [ref=f2e864] [cursor=pointer]:
                      - /url: "#cite_note-Krishnan_2017-88"
              - region [ref=f2e866]:
                - heading "Animals" [level=4] [ref=f2e868]
                - figure [ref=f2e869]:
                  - link [ref=f2e870] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Hypothenemus.jpg
                  - generic [ref=f2e872]:
                    - text: The
                    - link "coffee borer beetle" [ref=f2e873] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Coffee_borer_beetle
                    - text: is a major insect pest of the world's coffee industry.
                    - superscript [ref=f2e874]:
                      - link "[86]" [ref=f2e875] [cursor=pointer]:
                        - /url: "#cite_note-Graham_2013-89"
                - paragraph [ref=f2e877]:
                  - text: Over 900 species of insect have been recorded as pests of coffee crops worldwide. Of these, over a third are
                  - link "beetles" [ref=f2e878] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coleoptera
                  - text: ", and over a quarter are"
                  - link "bugs" [ref=f2e879] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Hemiptera
                  - text: . Some
                  - link "20 species of nematodes" [ref=f2e880] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coffee_root-knot_nematode
                  - text: ", 9 species of mites, and several snails and slugs also attack the crop. Birds and rodents sometimes eat coffee berries, but their impact is minor compared to invertebrates."
                  - superscript [ref=f2e881]:
                    - link "[87]" [ref=f2e882] [cursor=pointer]:
                      - /url: "#cite_note-90"
                  - text: In general, C. arabica is the more sensitive species to invertebrate predation overall. Each part of the coffee plant is assailed by different animals. Nematodes attack the roots,
                  - link "coffee borer beetles" [ref=f2e884] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coffee_borer_beetle
                  - text: burrow into stems and woody material,
                  - superscript [ref=f2e885]:
                    - link "[88]" [ref=f2e886] [cursor=pointer]:
                      - /url: "#cite_note-91"
                  - text: and the foliage is attacked by over 100 species of larvae of butterflies and moths.
                  - superscript [ref=f2e888]:
                    - link "[89]" [ref=f2e889] [cursor=pointer]:
                      - /url: "#cite_note-92"
                - paragraph [ref=f2e891]:
                  - text: Mass spraying of
                  - link "insecticides" [ref=f2e892] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Insecticide
                  - text: has often proven disastrous, as predators of the pests are more sensitive than the pests themselves.
                  - superscript [ref=f2e893]:
                    - link "[90]" [ref=f2e894] [cursor=pointer]:
                      - /url: "#cite_note-93"
                  - text: Instead, integrated pest management has been developed, using techniques such as targeted treatment of pest outbreaks and managing crop environment away from conditions favoring pests. Branches infested with scale are often cut and left on the ground, which causes scale parasites to attack the scale on the fallen branches as well as in the plant.
                  - superscript [ref=f2e896]:
                    - link "[91]" [ref=f2e897] [cursor=pointer]:
                      - /url: "#cite_note-94"
                - paragraph [ref=f2e899]:
                  - text: The 2-mm-long coffee borer beetle (Hypothenemus hampei) is the most damaging insect pest of the world's coffee industry, destroying up to 50 percent or more of the coffee berries on plantations in most coffee-producing countries. The adult female beetle nibbles a single tiny hole in a coffee berry and lays 35 to 50 eggs. Inside, the offspring grow, mate, and then emerge from the commercially ruined berry to disperse, repeating the cycle. Pesticides are mostly ineffective because the beetle juveniles are protected inside the berry nurseries, but they are vulnerable to predation by birds when they emerge. When groves of trees are nearby, the
                  - link "American yellow warbler" [ref=f2e900] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/American_yellow_warbler
                  - text: ","
                  - link "rufous-capped warbler" [ref=f2e901] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Rufous-capped_warbler
                  - text: ", and other insectivorous birds have been shown to reduce by 50 percent the number of coffee berry borers in Costa Rica coffee plantations."
                  - superscript [ref=f2e902]:
                    - link "[86]" [ref=f2e903] [cursor=pointer]:
                      - /url: "#cite_note-Graham_2013-89"
            - region [ref=f2e905]:
              - heading "Ecological effects" [level=3] [ref=f2e907]
              - note [ref=f2e908]:
                - text: "See also:"
                - link "Sustainable coffee" [ref=f2e909] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sustainable_coffee
              - figure [ref=f2e910]:
                - link [ref=f2e911] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Shade_grown_coffee_in_Guatemala.jpg
                - generic [ref=f2e913]:
                  - link "Shade-grown coffee" [ref=f2e914] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Shade-grown_coffee
                  - text: in
                  - link "Guatemala" [ref=f2e915] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Guatemala
              - paragraph [ref=f2e916]:
                - text: Originally, coffee was grown in the shade of trees that provided a habitat for many animals and insects.
                - superscript [ref=f2e917]:
                  - link "[92]" [ref=f2e918] [cursor=pointer]:
                    - /url: "#cite_note-Janzen-95"
                - text: Remnant forest trees were used for this purpose, but many species have been planted as well. These include leguminous trees of the genera
                - link "Acacia" [ref=f2e921] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Acacia
                - text: ","
                - link "Albizia" [ref=f2e923] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Albizia
                - text: ","
                - link "Cassia" [ref=f2e925] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cassia_(genus)
                - text: ","
                - link "Erythrina" [ref=f2e927] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Erythrina
                - text: ","
                - link "Gliricidia" [ref=f2e929] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Gliricidia
                - text: ","
                - link "Inga" [ref=f2e931] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Inga
                - text: ", and"
                - link "Leucaena" [ref=f2e933] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Leucaena
                - text: ", as well as the nitrogen-fixing non-legume sheoaks of the genus"
                - link "Casuarina" [ref=f2e935] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Casuarina
                - text: ", and the silky oak"
                - link "Grevillea robusta" [ref=f2e937] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Grevillea_robusta
                - text: .
                - superscript [ref=f2e938]:
                  - link "[93]" [ref=f2e939] [cursor=pointer]:
                    - /url: "#cite_note-96"
                - text: This method is commonly called "
                - link "shade-grown coffee" [ref=f2e941] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Shade-grown_coffee
                - text: "\". Starting in the 1970s, many farmers switched their production methods to sun cultivation, in which coffee is grown in rows under full sun with little or no forest canopy. This causes berries to ripen more rapidly and bushes to produce higher yields, but the method requires the clearing of trees and increased use of fertilizer and pesticides, which damage the environment and cause health problems."
                - superscript [ref=f2e942]:
                  - link "[94]" [ref=f2e943] [cursor=pointer]:
                    - /url: "#cite_note-Salvesen-97"
                - text: "Unshaded coffee plants grown with fertilizer yield the most coffee, although unfertilized shaded crops generally yield more than unfertilized unshaded crops: the response to fertilizer is much greater in full sun."
                - superscript [ref=f2e945]:
                  - link "[95]" [ref=f2e946] [cursor=pointer]:
                    - /url: "#cite_note-98"
                - text: While traditional coffee production causes berries to ripen more slowly and produce lower yields, the quality of the coffee is allegedly superior.
                - superscript [ref=f2e948]:
                  - link "[96]" [ref=f2e949] [cursor=pointer]:
                    - /url: "#cite_note-cec1999-99"
                - text: According to The International Coffee Organization factors such as drought, unfavourable temperature and climate change greatly affect coffee quality.
                - superscript [ref=f2e951]:
                  - link "[97]" [ref=f2e952] [cursor=pointer]:
                    - /url: "#cite_note-100"
                - text: In addition, the traditional shaded method provides living space for many wildlife species. Proponents of shade cultivation say environmental problems such as deforestation, pesticide pollution, habitat destruction, and soil and water degradation are the side effects of the practices employed in sun cultivation.
                - superscript [ref=f2e954]:
                  - link "[92]" [ref=f2e955] [cursor=pointer]:
                    - /url: "#cite_note-Janzen-95"
                - superscript [ref=f2e957]:
                  - link "[98]" [ref=f2e958] [cursor=pointer]:
                    - /url: "#cite_note-101"
                - text: The
                - link "American Birding Association" [ref=f2e960] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/American_Birding_Association
                - text: ","
                - link "Smithsonian Migratory Bird Center" [ref=f2e961] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Smithsonian_Migratory_Bird_Center
                - text: ","
                - superscript [ref=f2e962]:
                  - link "[99]" [ref=f2e963] [cursor=pointer]:
                    - /url: "#cite_note-migratory-102"
                - link "National Arbor Day Foundation" [ref=f2e965] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/National_Arbor_Day_Foundation
                - text: ","
                - superscript [ref=f2e966]:
                  - link "[100]" [ref=f2e967] [cursor=pointer]:
                    - /url: "#cite_note-arbor-103"
                - text: and the
                - link "Rainforest Alliance" [ref=f2e969] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Rainforest_Alliance
                - text: have led a campaign for 'shade-grown' and
                - link "organic coffees" [ref=f2e970] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Organic_coffee
                - text: ", which can be sustainably harvested."
                - superscript [ref=f2e971]:
                  - link "[101]" [ref=f2e972] [cursor=pointer]:
                    - /url: "#cite_note-104"
                - text: Shaded coffee cultivation systems show greater biodiversity than full-sun systems, and those more distant from continuous forest compare rather poorly to undisturbed native forest in terms of habitat value for some bird species.
                - superscript [ref=f2e974]:
                  - link "[102]" [ref=f2e975] [cursor=pointer]:
                    - /url: "#cite_note-sciam2000-105"
                - superscript [ref=f2e977]:
                  - link "[103]" [ref=f2e978] [cursor=pointer]:
                    - /url: "#cite_note-Rickert2005-106"
              - paragraph [ref=f2e980]:
                - text: Coffee production uses a large volume of water. On average it takes about 140 liters (37
                - link "U.S. gal" [ref=f2e981] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/US_gallon
                - text: ) of water to grow the coffee beans needed to produce one cup of coffee. Growing the plants needed to produce 1 kg (2.2 lb) of roasted coffee in Africa, South America or Asia requires 26,400 liters (7,000
                - link "U.S. gal" [ref=f2e982] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/US_gallon
                - text: ) of water.
                - superscript [ref=f2e983]:
                  - link "[104]" [ref=f2e984] [cursor=pointer]:
                    - /url: "#cite_note-107"
                - text: As with many other forms of agriculture, often much of this is rainwater, much of which would otherwise run off into rivers or coastlines, while much water actually absorbed by the plants is
                - link "transpired" [ref=f2e986] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Transpiration
                - text: back into the local environment through the plants' leaves (especially for cooling effects); broad estimates aside, consequential
                - link "margins" [ref=f2e987] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Margin_(economics)
                - text: vary considerably based on details of local geography and
                - link "horticultural" [ref=f2e988] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Horticultural
                - text: practice. Coffee is often grown in countries where there is a water shortage, such as Ethiopia.
                - superscript [ref=f2e989]:
                  - link "[105]" [ref=f2e990] [cursor=pointer]:
                    - /url: "#cite_note-108"
              - paragraph [ref=f2e992]:
                - link "Used coffee grounds" [ref=f2e993] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Used_coffee_grounds
                - text: may be used for composting or as a mulch. They are especially appreciated by worms and acid-loving plants such as blueberries.
                - superscript [ref=f2e994]:
                  - link "[106]" [ref=f2e995] [cursor=pointer]:
                    - /url: "#cite_note-109"
                - text: Climate change may significantly impact coffee yields during the 21st century, such as in Nicaragua and Ethiopia which could lose more than half of the farming land suitable for growing (Arabica) coffee.
                - superscript [ref=f2e997]:
                  - link "[107]" [ref=f2e998] [cursor=pointer]:
                    - /url: "#cite_note-laderach-110"
                - superscript [ref=f2e1000]:
                  - link "[108]" [ref=f2e1001] [cursor=pointer]:
                    - /url: "#cite_note-Moat-111"
                - superscript [ref=f2e1003]:
                  - link "[109]" [ref=f2e1004] [cursor=pointer]:
                    - /url: "#cite_note-worland-112"
                - text: As of 2016, at least 34% of global coffee production was compliant with
                - link "voluntary sustainability standards" [ref=f2e1006] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Sustainability_standards_and_certification
                - text: such as
                - link "Fairtrade" [ref=f2e1007] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fairtrade_certification
                - text: ","
                - link "UTZ" [ref=f2e1008] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/UTZ_Certified
                - text: ", and 4C (The Common Code for the Coffee Community)."
                - superscript [ref=f2e1009]:
                  - link "[110]" [ref=f2e1010] [cursor=pointer]:
                    - /url: "#cite_note-113"
            - region [ref=f2e1012]:
              - heading "Preprocessing" [level=3] [ref=f2e1014]
              - paragraph [ref=f2e1015]:
                - text: Coffee berries are traditionally selectively picked by hand, which is labor-intensive as it involves the selection of only the berries at the peak of ripeness. More commonly, crops are strip picked, where all berries are harvested simultaneously regardless of ripeness by person or machine. After picking, green coffee is processed by one of two types of method—a dry process method which is often simpler and less labor-intensive, and a wet process method, which incorporates batch fermentation, uses larger amounts of water in the process, and often yields a milder coffee.
                - superscript [ref=f2e1016]:
                  - link "[111]" [ref=f2e1017] [cursor=pointer]:
                    - /url: "#cite_note-114"
              - paragraph [ref=f2e1019]:
                - text: Then they are sorted by ripeness and color, and most often the flesh of the berry is removed, usually by machine, and the seeds are fermented to remove the slimy layer of
                - link "mucilage" [ref=f2e1020] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Mucilage
                - text: still present on the seed. When the fermentation is finished, the seeds are washed with large quantities of fresh water to remove the fermentation residue, which generates massive amounts of
                - link "coffee wastewater" [ref=f2e1021] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_wastewater
                - text: . Finally, the seeds are dried.
                - superscript [ref=f2e1022]:
                  - link "[112]" [ref=f2e1023] [cursor=pointer]:
                    - /url: "#cite_note-kummer2003p38-115"
              - paragraph [ref=f2e1025]:
                - text: Using drying tables produces the most uniform effect with less fermentation. In this method, the pulped and fermented coffee is spread thinly on raised beds, which allows the air to pass on all sides of the coffee, and then the coffee is mixed by hand. It is not done very often; most African coffee is dried in this manner, and in the early 20th century a few coffee farms around the world were starting to use this method.
                - superscript [ref=f2e1026]:
                  - link "[112]" [ref=f2e1027] [cursor=pointer]:
                    - /url: "#cite_note-kummer2003p38-115"
                - text: Next, the coffee is sorted, and labeled as green coffee. Some companies use cylinders to pump in heated air to dry the coffee seeds, though this is generally in places where the humidity is very high.
                - superscript [ref=f2e1029]:
                  - link "[112]" [ref=f2e1030] [cursor=pointer]:
                    - /url: "#cite_note-kummer2003p38-115"
              - figure [ref=f2e1032]:
                - link [ref=f2e1033] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Kopi_luwak_090910-0075_lamb.JPG
                - generic [ref=f2e1035]:
                  - link "Kopi luwak" [ref=f2e1036] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Kopi_luwak
                  - text: ", coffee berries that have been preprocessed by passing through the"
                  - link "Asian palm civet" [ref=f2e1037] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Asian_palm_civet
                  - text: "'s digestive tract"
                  - superscript [ref=f2e1038]:
                    - link "[113]" [ref=f2e1039] [cursor=pointer]:
                      - /url: "#cite_note-marcone-116"
              - paragraph [ref=f2e1041]:
                - text: An Asian coffee known as
                - link "kopi luwak" [ref=f2e1042] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kopi_luwak
                - text: undergoes a peculiar process made from coffee berries eaten by the
                - link "Asian palm civet" [ref=f2e1043] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Asian_palm_civet
                - text: ", passing through its digestive tract, with the beans harvested from"
                - link "feces" [ref=f2e1044] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Feces
                - text: . Coffee brewed from this process
                - superscript [ref=f2e1045]:
                  - link "[113]" [ref=f2e1046] [cursor=pointer]:
                    - /url: "#cite_note-marcone-116"
                - text: is among the most expensive in the world, with bean prices reaching $160 per pound or $30 per brewed cup.
                - superscript [ref=f2e1048]:
                  - link "[114]" [ref=f2e1049] [cursor=pointer]:
                    - /url: "#cite_note-econ-117"
                - text: Kopi luwak coffee is said to have a uniquely rich, slightly smoky aroma and flavor with hints of chocolate, resulting from the action of
                - link "digestive enzymes" [ref=f2e1051] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Digestive_enzymes
                - text: breaking down bean proteins to facilitate partial fermentation.
                - superscript [ref=f2e1052]:
                  - link "[113]" [ref=f2e1053] [cursor=pointer]:
                    - /url: "#cite_note-marcone-116"
                - superscript [ref=f2e1055]:
                  - link "[114]" [ref=f2e1056] [cursor=pointer]:
                    - /url: "#cite_note-econ-117"
                - text: In Thailand, black ivory coffee beans are fed to elephants whose digestive enzymes reduce the bitter taste of beans collected from dung.
                - superscript [ref=f2e1058]:
                  - link "[115]" [ref=f2e1059] [cursor=pointer]:
                    - /url: "#cite_note-hp-118"
                - text: These beans sell for up to $1,100 a kilogram ($500 per lb), achieving the world's most expensive coffee,
                - superscript [ref=f2e1061]:
                  - link "[115]" [ref=f2e1062] [cursor=pointer]:
                    - /url: "#cite_note-hp-118"
                - text: three times costlier than palm civet coffee beans.
                - superscript [ref=f2e1064]:
                  - link "[114]" [ref=f2e1065] [cursor=pointer]:
                    - /url: "#cite_note-econ-117"
          - region [ref=f2e1067]:
            - heading "Processing" [level=2] [ref=f2e1069]
            - region [ref=f2e1070]:
              - heading "Roasting" [level=3] [ref=f2e1072]
              - note [ref=f2e1073]:
                - text: "Main article:"
                - link "Coffee roasting" [ref=f2e1074] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_roasting
              - figure "Roasted coffee beans" [ref=f2e1075]:
                - link [ref=f2e1076] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Roasted_coffee_beans.jpg
              - paragraph [ref=f2e1079]:
                - text: The next step in the process is the roasting of the green coffee. Coffee is usually sold in a roasted state, and with rare exceptions, such as infusions from green coffee beans,
                - superscript [ref=f2e1080]:
                  - link "[116]" [ref=f2e1081] [cursor=pointer]:
                    - /url: "#cite_note-119"
                - text: coffee is roasted before it is consumed. It can be sold roasted by the supplier, or it can be
                - link "home roasted" [ref=f2e1083] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Home_roasting_coffee
                - text: .
                - superscript [ref=f2e1084]:
                  - link "[117]" [ref=f2e1085] [cursor=pointer]:
                    - /url: "#cite_note-kummer2003p37-120"
                - text: The roasting process influences the taste by changing the coffee bean physically and chemically. The bean decreases in weight as moisture is lost and increases in volume, causing it to become less dense. The density of the bean also influences the strength of the coffee and the requirements for packaging.
              - paragraph [ref=f2e1087]:
                - text: The actual roasting begins when the temperature inside the bean reaches approximately 200 °C (392 °F), though different varieties of seeds differ in moisture and density and therefore roast at different rates.
                - superscript [ref=f2e1088]:
                  - link "[118]" [ref=f2e1089] [cursor=pointer]:
                    - /url: "#cite_note-trent-121"
                - text: During roasting,
                - link "caramelization" [ref=f2e1091] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Caramelization
                - text: occurs as intense heat breaks down
                - link "starches" [ref=f2e1092] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Starch
                - text: ", changing them to simple sugars that begin to brown, which darkens the color of the bean."
                - superscript [ref=f2e1093]:
                  - link "[119]" [ref=f2e1094] [cursor=pointer]:
                    - /url: "#cite_note-kummer2003p261-122"
              - paragraph [ref=f2e1096]:
                - text: Sucrose is rapidly lost during the roasting process and may disappear entirely in darker roasts. During roasting,
                - link "aromatic oils" [ref=f2e1097] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Essential_oil
                - text: and acids weaken, changing the flavor; at 205 °C (401 °F), other oils start to develop.
                - superscript [ref=f2e1098]:
                  - link "[118]" [ref=f2e1099] [cursor=pointer]:
                    - /url: "#cite_note-trent-121"
                - text: One of these oils, caffeol, is created at about 200 °C (392 °F), and is largely responsible for coffee's aroma and flavor.
                - superscript [ref=f2e1101]:
                  - link "[39]" [ref=f2e1102] [cursor=pointer]:
                    - /url: "#cite_note-plant-42"
                - text: The difference in caffeine content between a light roast and a dark roast is only about 0.1%.
                - superscript [ref=f2e1104]:
                  - link "[120]" [ref=f2e1105] [cursor=pointer]:
                    - /url: "#cite_note-123"
            - region [ref=f2e1107]:
              - heading "Grading roasted beans" [level=3] [ref=f2e1109]
              - note [ref=f2e1110]:
                - text: "See also:"
                - link "Food grading" [ref=f2e1111] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Food_grading
              - figure "Coffee \"cuppers\", or professional tasters, grade coffee." [ref=f2e1112]:
                - link [ref=f2e1113] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Fancy_a_cupper.jpg
                  - img "Two men hold spoons over a row of cups filled with coffee." [ref=f2e1114]
              - paragraph [ref=f2e1116]:
                - text: Depending on the color of the roasted beans as perceived by the human eye, they will be labeled as light, medium light, medium, medium dark, dark, or very dark. Typical terms used commercially, from the lightest to the darkest, are light, medium, sometimes medium-dark, full,
                - link "espresso" [ref=f2e1117] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Espresso
                - text: ", and high (or dark)."
                - superscript [ref=f2e1118]:
                  - link "[121]" [ref=f2e1119] [cursor=pointer]:
                    - /url: "#cite_note-124"
                - text: A more accurate method of discerning the degree of roast involves measuring the reflected light from roasted seeds illuminated with a light source in the near-infrared spectrum. This elaborate light meter uses a process known as
                - link "spectroscopy" [ref=f2e1121] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Spectroscopy
                - text: to return a number that consistently indicates the roasted coffee's relative degree of roast or flavor development. Coffee has, in many countries, been graded by size longer than it has been graded by quality. Grading is generally done with sieves, numbered to indicate the size of the perforations.
                - superscript [ref=f2e1122]:
                  - link "[122]" [ref=f2e1123] [cursor=pointer]:
                    - /url: "#cite_note-125"
            - region [ref=f2e1125]:
              - heading "Roast characteristics" [level=3] [ref=f2e1127]
              - paragraph [ref=f2e1128]:
                - text: The degree of roast affects coffee flavor and body. The color of the coffee after brewing is also affected by the degree of roasting.
                - superscript [ref=f2e1129]:
                  - link "[123]" [ref=f2e1130] [cursor=pointer]:
                    - /url: "#cite_note-126"
                - text: Darker roasts are generally bolder because they have less fiber content and a more sugary flavor. Lighter roasts have a more complex and therefore perceived stronger flavor from aromatic oils and acids otherwise destroyed by longer roasting times.
                - superscript [ref=f2e1132]:
                  - link "[124]" [ref=f2e1133] [cursor=pointer]:
                    - /url: "#cite_note-Mauro-127"
                - text: Roasting does not alter the amount of caffeine in the bean but does give less caffeine when the beans are measured by volume because the beans expand during roasting.
                - superscript [ref=f2e1135]:
                  - link "[125]" [ref=f2e1136] [cursor=pointer]:
                    - /url: "#cite_note-128"
                - text: A small amount of chaff is produced during roasting from the skin left on the seed after processing;
                - superscript [ref=f2e1138]:
                  - link "[126]" [ref=f2e1139] [cursor=pointer]:
                    - /url: "#cite_note-Bay-129"
                - text: is usually removed from the seeds by air movement, though a small amount is added to dark roast coffees to soak up oils on the seeds.
                - superscript [ref=f2e1141]:
                  - link "[118]" [ref=f2e1142] [cursor=pointer]:
                    - /url: "#cite_note-trent-121"
            - region [ref=f2e1144]:
              - heading "Decaffeination" [level=3] [ref=f2e1146]
              - paragraph [ref=f2e1147]:
                - link "Decaffeination" [ref=f2e1148] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Decaffeination
                - text: of coffee seeds is done while the seeds are still green. Many methods can remove caffeine from coffee, but all involve either soaking the green seeds in hot water (often called the "Swiss water process")
                - superscript [ref=f2e1149]:
                  - link "[127]" [ref=f2e1150] [cursor=pointer]:
                    - /url: "#cite_note-130"
                - text: or steaming them, then using a solvent to dissolve the caffeine-containing oils.
                - superscript [ref=f2e1152]:
                  - link "[39]" [ref=f2e1153] [cursor=pointer]:
                    - /url: "#cite_note-plant-42"
                - text: Decaffeination is often done by processing companies, and the extracted caffeine is usually sold to the pharmaceutical industry.
                - superscript [ref=f2e1155]:
                  - link "[39]" [ref=f2e1156] [cursor=pointer]:
                    - /url: "#cite_note-plant-42"
            - region [ref=f2e1158]:
              - heading "Storage" [level=3] [ref=f2e1160]
              - note [ref=f2e1161]:
                - text: "Main article:"
                - link "Coffee bean storage" [ref=f2e1162] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_bean_storage
              - paragraph [ref=f2e1163]:
                - text: Coffee is best stored in an airtight container made of ceramic, glass or non-reactive metal.
                - superscript [ref=f2e1164]:
                  - link "[128]" [ref=f2e1165] [cursor=pointer]:
                    - /url: "#cite_note-Consumer_Reports_May_2013-131"
                - text: Higher quality prepackaged coffee usually has a one-way valve that prevents air from entering while allowing the coffee to release gases.
                - superscript [ref=f2e1167]:
                  - link "[129]" [ref=f2e1168] [cursor=pointer]:
                    - /url: "#cite_note-foodnetwork-truebrew-132"
                - text: Coffee freshness and flavor is preserved when it is stored away from moisture, heat, and light. The tendency of coffee to absorb strong smells from food means that it should be kept away from such smells. Storage of coffee in refrigerators is not recommended due to the presence of moisture which can cause deterioration. Exterior walls of buildings that face the sun may heat the interior of a home, and this heat may damage coffee stored near such a wall. Heat from nearby ovens also harms stored coffee.
                - superscript [ref=f2e1170]:
                  - link "[128]" [ref=f2e1171] [cursor=pointer]:
                    - /url: "#cite_note-Consumer_Reports_May_2013-131"
              - paragraph [ref=f2e1173]:
                - text: In 1931, a method of packing coffee in a sealed vacuum in cans was introduced. The roasted coffee was packed and then 99% of the air was removed, allowing the coffee to be stored indefinitely until the can was opened. Today this method is widely used.
                - superscript [ref=f2e1174]:
                  - link "[130]" [ref=f2e1175] [cursor=pointer]:
                    - /url: "#cite_note-133"
          - region [ref=f2e1177]:
            - heading "Preparation" [level=2] [ref=f2e1179]
            - region [ref=f2e1180]:
              - heading "Brewing" [level=3] [ref=f2e1182]
              - note [ref=f2e1183]:
                - text: "Main article:"
                - link "Coffee preparation" [ref=f2e1184] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_preparation
              - figure "A contemporary electric automatic drip-coffee maker" [ref=f2e1185]:
                - link [ref=f2e1186] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Consumer_Reports_-_Zojirushi_coffeemaker_alt.tif
              - figure [ref=f2e1189]:
                - link [ref=f2e1190] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:Linea_doubleespresso.jpg
                - generic [ref=f2e1192]:
                  - link "Espresso" [ref=f2e1193] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Espresso
                  - text: is one of the most popular coffee-brewing methods. The term espresso, substituting s for most x letters in
                  - link "Latin" [ref=f2e1194] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Latin
                  - text: "-root words, with the term deriving from the past participle of the Italian verb esprimere, itself derived from the Latin exprimere, means 'to express', and refers to the process by which hot water is forced under pressure through ground coffee."
                  - superscript [ref=f2e1195]:
                    - link "[131]" [ref=f2e1196] [cursor=pointer]:
                      - /url: "#cite_note-philips-134"
                  - superscript [ref=f2e1198]:
                    - link "[132]" [ref=f2e1199] [cursor=pointer]:
                      - /url: "#cite_note-135"
              - paragraph [ref=f2e1201]:
                - text: Coffee beans must be ground and brewed to create a beverage. The criteria for choosing a method include flavor and economy. Almost all methods of preparing coffee require that the beans be ground and then mixed with hot water long enough to allow the flavor to emerge but not so long as to draw out bitter compounds. The liquid can be consumed after the spent grounds are removed. Brewing considerations include the fineness of the grind, how the water is used to extract the flavor, the ratio of coffee grounds to water (the brew ratio), additional flavorings such as sugar, milk, and spices, and the technique to be used to separate spent grounds. Optimal
                - link "coffee extraction" [ref=f2e1202] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_extraction
                - text: occurs between 91 and 96 °C (196 and 205 °F).
                - superscript [ref=f2e1203]:
                  - link "[133]" [ref=f2e1204] [cursor=pointer]:
                    - /url: "#cite_note-136"
                - text: Ideal holding temperatures range from 85 to 88 °C (185 to 190 °F) to as high as 93 °C (199 °F), and the ideal serving temperature is 68 to 79 °C (154 to 174 °F).
                - superscript [ref=f2e1206]:
                  - link "[134]" [ref=f2e1207] [cursor=pointer]:
                    - /url: "#cite_note-137"
              - paragraph [ref=f2e1209]:
                - text: Coffee beans may be ground with a
                - link "burr grinder" [ref=f2e1210] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Burr_mill
                - text: ", which uses revolving elements to shear the seed; a"
                - link "blade grinder" [ref=f2e1211] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Blade_grinder
                - text: cuts the seeds with blades moving at high speed; or a mortar and pestle crushes the seeds. For most brewing methods a burr grinder is deemed superior because the grind is more even, and the grind size can be adjusted.
                - superscript [ref=f2e1212]:
                  - link "[135]" [ref=f2e1213] [cursor=pointer]:
                    - /url: "#cite_note-138"
                - text: The type of grind is often named after the brewing method for which it is generally used,
                - link "Turkish grind" [ref=f2e1215] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Turkish_coffee
                - text: being the finest, while
                - link "coffee percolator" [ref=f2e1216] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_percolator
                - text: or
                - link "French press" [ref=f2e1217] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/French_press
                - text: "are the coarsest. The most common grinds are between these extremes: a medium grind is used in most home coffee-brewing machines."
                - superscript [ref=f2e1218]:
                  - link "[136]" [ref=f2e1219] [cursor=pointer]:
                    - /url: "#cite_note-Rothstein-139"
              - paragraph [ref=f2e1221]:
                - text: Coffee may be brewed by several methods. It may be boiled, steeped, or pressurized. Brewing coffee by boiling is the earliest method, and Turkish coffee is an example of this method. It is prepared by grinding or pounding the seeds to a fine powder, then adding it to water and bringing it to a boil very briefly in a pot called a
                - link "cezve" [ref=f2e1223] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cezve
                - text: or, in Greek, a
                - generic "Greek-language text" [ref=f2e1224]: μπρίκι
                - text: ":"
                - generic "Greek-language text" [ref=f2e1225]: bríki
                - text: (from Turkish
                - generic "Turkish-language text" [ref=f2e1226]: ibrik
                - text: ). This produces a strong coffee with a layer of foam on the surface and sediment (which is not meant for drinking) settling at the bottom of the cup.
                - superscript [ref=f2e1227]:
                  - link "[1]" [ref=f2e1228] [cursor=pointer]:
                    - /url: "#cite_note-ukers-1"
              - paragraph [ref=f2e1230]:
                - link "Drip brewers" [ref=f2e1231] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Drip_coffee
                - text: and automatic
                - link "coffeemakers" [ref=f2e1232] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffeemaker
                - text: brew coffee using gravity. In an automatic coffeemaker, hot water drips onto coffee grounds that are held in a paper, plastic, or perforated metal
                - link "coffee filter" [ref=f2e1233] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Coffee_filter
                - text: ", allowing the water to seep through the ground coffee while extracting its oils and essences. The liquid drips through the coffee and the filter into a carafe or pot, and the spent coffee grounds are retained in the filter."
                - superscript [ref=f2e1234]:
                  - link "[137]" [ref=f2e1235] [cursor=pointer]:
                    - /url: "#cite_note-Levy-140"
              - paragraph [ref=f2e1237]:
                - text: In a coffee percolator, water is pulled under a pipe by gravity, which is then forced into a chamber above a filter by steam pressure created by boiling. The water then seeps through the grounds, and the process is repeated until terminated by removing it from the heat, by an internal timer,
                - superscript [ref=f2e1238]:
                  - link "[138]" [ref=f2e1239] [cursor=pointer]:
                    - /url: "#cite_note-141"
                - text: or by a thermostat that turns off the heater when the entire pot reaches a certain temperature.
              - paragraph [ref=f2e1241]:
                - text: The
                - link "espresso" [ref=f2e1242] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Espresso
                - text: method forces hot pressurized water through finely-ground coffee.
                - superscript [ref=f2e1243]:
                  - link "[136]" [ref=f2e1244] [cursor=pointer]:
                    - /url: "#cite_note-Rothstein-139"
                - text: As a result of brewing under high pressure (typically 9
                - link "bar" [ref=f2e1246] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bar_(unit)
                - text: ),
                - superscript [ref=f2e1247]:
                  - link "[139]" [ref=f2e1248] [cursor=pointer]:
                    - /url: "#cite_note-142"
                - text: the espresso beverage is more concentrated (as much as 10 to 15 times the quantity of coffee to water as gravity-brewing methods can produce) and has a more complex physical and chemical constitution.
                - superscript [ref=f2e1250]:
                  - link "[140]" [ref=f2e1251] [cursor=pointer]:
                    - /url: "#cite_note-143"
                - text: A well-prepared espresso has a reddish-brown foam called crema that floats on the surface.
                - superscript [ref=f2e1253]:
                  - link "[136]" [ref=f2e1254] [cursor=pointer]:
                    - /url: "#cite_note-Rothstein-139"
                - text: Other pressurized water methods include the
                - link "moka pot" [ref=f2e1256] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Moka_pot
                - text: and
                - link "vacuum coffee maker" [ref=f2e1257] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Vacuum_coffee_maker
                - text: . The
                - link "AeroPress" [ref=f2e1258] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/AeroPress
                - text: also works similarly, moving a column of water through a bed of coffee.
              - paragraph [ref=f2e1259]:
                - link "Cold brew coffee" [ref=f2e1260] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cold_brew_coffee
                - text: is made by steeping coarsely-ground beans in cold water for several hours, then filtering them.
                - superscript [ref=f2e1261]:
                  - link "[141]" [ref=f2e1262] [cursor=pointer]:
                    - /url: "#cite_note-Bonne-144"
                - text: This results in a brew lower in acidity than most hot-brewing methods.
            - region [ref=f2e1264]:
              - heading "Serving" [level=3] [ref=f2e1266]
              - note [ref=f2e1267]:
                - text: "\"Black coffee\" redirects here. For other uses, see"
                - link "Black Coffee (disambiguation)" [ref=f2e1268] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Black_Coffee_(disambiguation)
                - text: .
              - note [ref=f2e1269]:
                - text: "See also:"
                - link "List of coffee drinks" [ref=f2e1270] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/List_of_coffee_drinks
              - figure [ref=f2e1271]:
                - link [ref=f2e1272] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/File:French_School_-_Enjoying_Coffee_-_Google_Art_Project.jpg
                - generic [ref=f2e1274]:
                  - text: Enjoying coffee in Ottoman Empire. Painting by unknown artist in the
                  - link "Pera Museum" [ref=f2e1275] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Pera_Museum
                  - text: .
              - paragraph [ref=f2e1276]:
                - text: Once brewed, coffee may be served in a variety of ways. Drip-brewed, percolated, or French-pressed/cafetière coffee may be served as white coffee with a dairy product such as milk or cream, or dairy substitute, or as black coffee with no such addition. It may be sweetened with sugar or artificial sweetener. When served cold, it is called
                - link "iced coffee" [ref=f2e1278] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Iced_coffee
                - text: . Popular iced coffee options include
                - link "frappés" [ref=f2e1279] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Frappé_coffee
                - text: ", iced lattes, or stronger brewed coffee served with ice."
                - superscript [ref=f2e1280]:
                  - link "[142]" [ref=f2e1281] [cursor=pointer]:
                    - /url: "#cite_note-145"
              - paragraph [ref=f2e1283]:
                - text: Espresso-based coffee has a variety of possible presentations. In its most basic form, an espresso is served alone as a shot or short black, or with hot water added, when it is known as
                - link "caffè americano" [ref=f2e1284] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Caffè_americano
                - text: . A
                - link "long black" [ref=f2e1285] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Long_black
                - text: is made by pouring a double espresso into an equal portion of water, retaining the crema, unlike caffè americano.
                - superscript [ref=f2e1286]:
                  - link "[143]" [ref=f2e1287] [cursor=pointer]:
                    - /url: "#cite_note-Castle-146"
                - text: "Milk is added in various forms to an espresso: steamed milk makes a"
                - link "caffè latte" [ref=f2e1289] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Latte
                - text: ","
                - superscript [ref=f2e1290]:
                  - link "[144]" [ref=f2e1291] [cursor=pointer]:
                    - /url: "#cite_note-147"
                - text: equal parts steamed milk and milk froth make a
                - link "cappuccino" [ref=f2e1293] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Cappuccino
                - text: ","
                - superscript [ref=f2e1294]:
                  - link "[143]" [ref=f2e1295] [cursor=pointer]:
                    - /url: "#cite_note-Castle-146"
                - text: and a dollop of hot foamed milk on top creates a
                - link "caffè macchiato" [ref=f2e1297] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Caffè_macchiato
                - text: .
                - superscript [ref=f2e1298]:
                  - link "[145]" [ref=f2e1299] [cursor=pointer]:
                    - /url: "#cite_note-148"
                - text: A
                - link "flat white" [ref=f2e1301] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Flat_white
                - text: is prepared by adding steamed hot milk (
                - link "microfoam" [ref=f2e1302] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Microfoam
                - text: ) to two espresso shots;
                - superscript [ref=f2e1303]:
                  - link "[146]" [ref=f2e1304] [cursor=pointer]:
                    - /url: "#cite_note-149"
                - text: it has less milk than a latte, but both are varieties of coffee to which the milk can be added in such a way as to create a decorative surface pattern. Such effects are known as
                - link "latte art" [ref=f2e1306] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Latte_art
                - text: .
                - superscript [ref=f2e1307]:
                  - link "[147]" [ref=f2e1308] [cursor=pointer]:
                    - /url: "#cite_note-150"
              - paragraph [ref=f2e1310]:
                - text: "Coffee can be incorporated with alcohol to produce a variety of beverages: it is combined with whiskey in"
                - link "Irish coffee" [ref=f2e1311] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Irish_coffee
                - text: ", and it forms the base of alcoholic coffee liqueurs such as"
                - link "Kahlúa" [ref=f2e1312] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Kahlúa
                - text: and
                - link "Tia Maria" [ref=f2e1313] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Tia_Maria
                - text: . Some craft beers have coffee or coffee extracts added to the beer,
                - superscript [ref=f2e1314]:
                  - link "[148]" [ref=f2e1315] [cursor=pointer]:
                    - /url: "#cite_note-151"
                - text: although porter and stout beers may have a coffee-like taste solely due to roasted grains.
                - superscript [ref=f2e1317]:
                  - link "[149]" [ref=f2e1318] [cursor=pointer]:
                    - /url: "#cite_note-152"
              - region [ref=f2e1320]:
                - heading "\"Functional coffee\"" [level=4] [ref=f2e1322]
                - paragraph [ref=f2e1323]:
                  - text: Coffee can also be blended with ingredients claimed to improve health in a form described as a "functional coffee" drink.
                  - superscript [ref=f2e1324]:
                    - link "[150]" [ref=f2e1325] [cursor=pointer]:
                      - /url: "#cite_note-dean-153"
                  - text: Additions used include mushrooms, of which some of the most frequently used include
                  - link "lion's mane" [ref=f2e1327] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Hericium_erinaceus
                  - text: ","
                  - link "chaga" [ref=f2e1328] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Inonotus_obliquus
                  - text: ","
                  - link "Cordyceps" [ref=f2e1330] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Cordyceps
                  - text: ", and"
                  - link "reishi" [ref=f2e1331] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Lingzhi_(mushroom)
                  - text: .
                  - superscript [ref=f2e1332]:
                    - link "[151]" [ref=f2e1333] [cursor=pointer]:
                      - /url: "#cite_note-154"
                  - text: Mushroom coffee has about half the caffeine of standard coffee.
                  - superscript [ref=f2e1335]:
                    - link "[152]" [ref=f2e1336] [cursor=pointer]:
                      - /url: "#cite_note-Mushroom_coffee,_Huffpost-155"
                  - text: However, drinking mushroom coffee can result in digestive issues, and high amounts of powdered reishi mushroom can result in liver toxicity.
                  - superscript [ref=f2e1338]:
                    - link "[152]" [ref=f2e1339] [cursor=pointer]:
                      - /url: "#cite_note-Mushroom_coffee,_Huffpost-155"
                  - text: There is little clinical evidence for the benefits of mushroom coffee.
                  - superscript [ref=f2e1341]:
                    - link "[153]" [ref=f2e1342] [cursor=pointer]:
                      - /url: "#cite_note-156"
                - paragraph [ref=f2e1344]:
                  - text: "\"Functional\" additions also include"
                  - link "protein powder" [ref=f2e1345] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Protein_powder
                  - text: ","
                  - link "collagen" [ref=f2e1346] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Collagen
                  - text: ", and"
                  - link "ashwagandha" [ref=f2e1347] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Ashwagandha
                  - text: .
                  - superscript [ref=f2e1348]:
                    - link "[150]" [ref=f2e1349] [cursor=pointer]:
                      - /url: "#cite_note-dean-153"
              - region [ref=f2e1351]:
                - heading "Instant coffee" [level=4] [ref=f2e1353]
                - note [ref=f2e1354]:
                  - text: "Main article:"
                  - link "Instant coffee" [ref=f2e1355] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Instant_coffee
                - figure "Instant coffee" [ref=f2e1356]:
                  - link [ref=f2e1357] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/File:Instant_coffee.jpg
                - paragraph [ref=f2e1360]:
                  - text: Many products are sold for the convenience of consumers who do not want to prepare their coffee or who do not have access to coffeemaking equipment. Instant coffee is dried into soluble powder or
                  - link "freeze-dried" [ref=f2e1361] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Freeze_drying
                  - text: into granules that can be quickly dissolved in hot water.
                  - superscript [ref=f2e1362]:
                    - link "[154]" [ref=f2e1363] [cursor=pointer]:
                      - /url: "#cite_note-157"
                  - text: A New Zealand invention and staple, instant coffee was originally invented in Invercargill in 1890 by food chemist David Strang.
                  - superscript [ref=f2e1365]:
                    - link "[155]" [ref=f2e1366] [cursor=pointer]:
                      - /url: "#cite_note-158"
                  - text: It rapidly gained in popularity in many countries in the post-war period, with
                  - link "Nescafé" [ref=f2e1368] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Nescafé
                  - text: being the most popular product.
                  - superscript [ref=f2e1369]:
                    - link "[156]" [ref=f2e1370] [cursor=pointer]:
                      - /url: "#cite_note-FOOTNOTEPendergrast2001195-159"
                  - text: Many consumers determined that the convenience of preparing a cup of instant coffee more than made up for a perceived inferior taste,
                  - superscript [ref=f2e1372]:
                    - link "[157]" [ref=f2e1373] [cursor=pointer]:
                      - /url: "#cite_note-FOOTNOTEPendergrast2001196-160"
                  - text: although, since the late 1970s, instant coffee has been produced differently in such a way that is similar to the taste of freshly brewed coffee.
                  - superscript [ref=f2e1375]:
                    - link "[158]" [ref=f2e1376] [cursor=pointer]:
                      - /url: "#cite_note-161"
                  - text: Paralleling (and complementing) the rapid rise of instant coffee was the
                  - link "coffee vending machine" [ref=f2e1378] [cursor=pointer]:
                    - /url: https://en.wikipedia.org/wiki/Coffee_vending_machine
                  - text: invented in 1947 and widely distributed since the 1950s.
                  - superscript [ref=f2e1379]:
                    - link "[159]" [ref=f2e1380] [cursor=pointer]:
                      - /url: "#cite_note-FOOTNOTEPendergrast2001197-162"
          - region [ref=f2e1382]:
            - heading "Economics" [level=2] [ref=f2e1384]
            - note [ref=f2e1385]:
              - text: "Main article:"
              - link "Economics of coffee" [ref=f2e1386] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Economics_of_coffee
            - table [ref=f2e1387]:
              - caption [ref=f2e1388]: Green coffee production 2023, millions of tonnes
              - rowgroup [ref=f2e1389]:
                - row [ref=f2e1390]:
                  - cell [ref=f2e1391]:
                    - link "Brazil" [ref=f2e1395] [cursor=pointer]:
                      - /url: https://en.wikipedia.org/wiki/Brazil
